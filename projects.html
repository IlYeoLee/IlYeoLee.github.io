<template id="proj-hotcake">
<img loading="lazy" src="img/hotcake/01.png" alt="">
<div class="ptext"><p><b>Hotcak</b>e</b></b><br><b>Heat It, Play It, Hotcake</b></b><br><br>Hotcake lets you enjoy playing music with your friends, no matter where you are. It delivers rich, 3D sound that makes it feel like you are all in the same room. Hotcake keeps everyone perfectly in sync, so you can feel magical moments. Experience immersive, unforgettable jam sessions even in your home.</b></b></b></b></p><p><br></div>
<img loading="lazy" src="img/hotcake/02.jpg" alt="">
<div class="ptext"><p><br></b></b></p><p>Music is a part of everyday life. Some people want to truly engage and participate. Which means some people grab an instrument and begin their journey as a “bedroom musician’’.</b></b><br></p><p><br></b></b></div>
<img loading="lazy" src="img/hotcake/03.png" alt="">
<div class="ptext"><p><b>Music Comes Alive Together</b><br><br>Music is never complete when played alone. As different instruments come together, the sound becomes richer and more joyful. At firs</b></b>t, you might play alone in your room, but before long, you’ll want to play with others. You just can’t fully experience the thrill of trading rhythms and locking into a groove when you’re playing solo.</b></b></p><p><br></div>
<img loading="lazy" src="img/hotcake/04.png" alt="">
<div class="ptext"><p>Jam sessions once meant going to a rehearsal studio — carrying heavy instruments, paying a fee, and feeling the pressure to perform perfectly. But what if you could play together from home? Hotcake offers a more relaxed and enjoyable way to connect. Play in your own space, and don’t worry if the beat slips or a note goes astray. Just let the music take over your soul.<br><br><a href="https://heyzine.com/flip-book/bf650f1c48.html#page/1" target="_blank" rel="noopener"><b>▶︎ More Detailed Story</b></b></a></b></b></b></p><p><br></div>
<div class="ptext"><p><br></b></p><p><b>Heat It, Play It, Hotcake</b></b></b></p><p><br></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110485351?h=89f8c2a04f&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<img loading="lazy" src="img/hotcake/05.png" alt="">
<img loading="lazy" src="img/hotcake/06.png" alt="">
<img loading="lazy" src="img/hotcake/07.png" alt="">
<div class="ptext"><p><b><br></b></b></b></p><p><b>Online Jam, Perfected Cake &amp; Butter</b><br><br>Hotcake includes Cake, a modular speaker and woofer system, and Butter, a wearable device that lets you feel the music. Hotcake turns the sounds from your jam session into immersive 3D audio, making it feel like you’re all playing in the same room. Butter also sends vibrations, so you can feel the beat as you play. </b></b></p><p></div>
<img loading="lazy" src="img/hotcake/08.jpg" alt="">
<img loading="lazy" src="img/hotcake/09.png" alt="">
<img loading="lazy" src="img/hotcake/10.png" alt="">
<div class="pgrid cols-2"><img loading="lazy" src="img/hotcake/11.jpg" alt=""><img loading="lazy" src="img/hotcake/12.png" alt=""></div>
<div class="ptext"><p><b><br></b></b></b></p><p><b>The Cake<br>Half a World Away, Still in Sync.</b></b></b></p><p>Perfect timing is very important for online jam sessions. Cake makes sure there is no delay or freezing, so everything feels smooth. Cake stays connected through a wired Ethernet, delivering real-time audio no matter the distance. Each module picks up the live sound from the station via a 2.4GHz RF channel, making sure your online jam feels smooth and perfectly in sync.</b></b></p><p><br></b></b></div>
<div class="pgrid cols-2"><img loading="lazy" src="img/hotcake/13.png" alt=""><img loading="lazy" src="img/hotcake/14.jpg" alt=""></div>
<div class="ptext"><p><b>The Butter<br>Adding Texture to Music.</b></b></b></b></p><p>What makes live music special is the way you can feel it in your body. Butter brings this feeling. It syncs haptics to the music you're playing, adding a rich layer to the sound. Also, you can switch to metronome mode to stay on beat or use the built-in mic to chat with others.</b></b></p><p><br></b></b></p><p><br></div>
<div class="pgrid cols-4"><img loading="lazy" src="img/hotcake/15.png" alt=""><img loading="lazy" src="img/hotcake/16.png" alt=""><img loading="lazy" src="img/hotcake/17.png" alt=""><img loading="lazy" src="img/hotcake/18.png" alt=""></div>
<div class="ptext"><p>⠀⠀</div>
<div class="pgrid cols-2"><img loading="lazy" src="img/hotcake/19.png" alt=""><img loading="lazy" src="img/hotcake/20.png" alt=""></div>
<div class="ptext"><p><b>Hotcake Scenario</b></b></b></p><p><b>(1) Connection with Sessions</b></b></b></p><p><br></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110647574?h=11795ee15e&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;%C2%80%C2%A8amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110648419?h=de446eb163&amp;badge=0&amp;autopause=0&amp;background=1&amp;%C2%80%C2%A8amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="ptext"><p><b><br></b></b></b></p><p><b>Your Instant Band, Anytime, Anywhere</b></b><br><br>If there is no one around to jam with, just open Hotcake’s community. You can find new bandmates who share your taste in music, or start a session with a friend from your list. Missing a player? An AI musician will jump in and play along with your rhythm, so you can always enjoy a full and immersive session.</b></b></p><p><br></b></b></div>
<div class="ptext"><p><b>(2) New Experience with Hotcake</b></b></b></p><p><b><br></b></b></b></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110485315?h=638bffcdb3&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110521104?h=95ad6cebf0&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;%C2%80%C2%A8amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="ptext"><p><b><br></b></b></b></p><p><b>A Live Experience with Light, Vibration, Sound</b><br><br>Set up modular speakers and experience more than just sound. Cake lights up in real time, so you can visually feel your friends’ performances as they play. Pair them with Butter, which is the wearable device. Feel the rhythm and groove through haptic.</b></b></p><p><br></b></b></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110650182?h=d60c2edb38&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110529439?h=c68dcc8912&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;%C2%80%C2%A8amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="ptext"><p><b><br></b></b></b></p><p><b>At Home, But Louder, More Fun</b><br><br>The best part of playing together is when everyone’s timing clicks. At this perfect moment, LED lights turn your room into a stage. When the music hits its peak, gesture motion triggers sound effects. So you can explore your jam session.</b></b></p><p><br></b></b></div>
<div class="ptext"><p><b>(3) Frame the Heated Moment</b></b></b></p><p><b><br></b></b></b></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110643864?h=3fed7b27cd&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;%C2%80%C2%A8amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="ptext"><p><b>Return To The Heat Of The Jam</b><br><br>After the jam, AI automatically edits your solo parts and h</b>ighlights them into a complete video. So, you can share it with your bandmates to keep the feeling going. Replay your performance and relive the spark of the session anytime.</b></b><br></p><p><br></div>
<div class="pgrid cols-2"><img loading="lazy" src="img/hotcake/21.png" alt=""><img loading="lazy" src="img/hotcake/22.png" alt=""></div>
<div class="ptext"><p><b><br></b></b></b></p><p><b>New Expandability<br>Playing Together, For Everyone</b><br><br>Hotcake becomes a platform where everyone can enjoy jamming, without changing how you normally play. For those who are deaf or hard of hearing to feel the rhythm, Butter features music haptics make you feel the rhythm through vibrations and join the session. Enjoy an immersive playing experience anytime, anywhere with Studio Mode headphones. It is a new music life, where your personal expression becomes part of the content.</b></b></p><p><br></b></b></div>
<div class="ptext"><p><b>Heat It, Play It, Groove It, Melt It, Drop It, </b></b></b></p><p><b>Fade It, Link It, Hotcak</b>e</b></b></b><br></p><p><br></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110517768?h=e9c44a53e7&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110500869?h=1a5cf7f644&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>

<template id="proj-comong">
<div class="ptext left"><p><b>COMONG — 강아지와 함께 쓰는 AI 에어 멀티플라이어</b><br></p>
<p>삼성디자인멤버십 × IDEO 프로젝트 · Team 6<br>Industrial Design 정민서(PL) · UXUI 이일여 · BX 장유진 · 최완혁</p></div>
<img loading="lazy" src="img/comong/01.jpg" alt="">
<div class="ptext left"><p class="label">01 BACKGROUND</p>
<p><b>냉방 사각지대의 반려견</b><br>가정의 냉방은 사람의 체감을 기준으로 이루어지며, 같은 공간의 반려견은 그 대상에서 빠져 있습니다.<br>선풍기 바람이 강아지에게 실제로 시원한지 검증하는 것에서 리서치를 시작했습니다.</p>
<p><b>강아지의 체온 조절 방식</b><br>강아지는 땀을 흘리지 않고, 혀와 발바닥으로 수분을 증발시켜 체온을 낮춥니다.<br>그래서 정면에서 부는 직접풍은 거의 시원하게 느껴지지 않습니다.<br>필요한 것은 강한 바람이 아니라, 바닥을 식히고 공기를 순환시키는 간접적인 시원함입니다.</p></div>
<img loading="lazy" src="img/comong/02.jpg" alt="">
<img loading="lazy" src="img/comong/03.jpg" alt="">
<img loading="lazy" src="img/comong/04.jpg" alt="">
<img loading="lazy" src="img/comong/05.jpg" alt="">
<img loading="lazy" src="img/comong/06.jpg" alt="">
<div class="ptext left"><p class="label">02 RESEARCH</p>
<p><b>보호자 인터뷰</b><br>이니셜·인뎁스 인터뷰에서 반려견의 바람 선호를 확인했습니다.<br>&quot;직풍을 싫어해서 바람이 세면 다른 곳으로 가버려요.&quot;<br>&quot;옆으로 확산되는 은은한 바람은 좋아해요.&quot;</p>
<p><b>전문가 견해</b><br>훈련사와 수의사 모두 직접풍이 강아지에게 큰 도움이 되지 않는다고 답했습니다.<br>직접풍은 눈을 건조하게 만들고, 기화 냉각이 되지 않는 강아지에게는 효율이 낮습니다.<br>강아지는 혀·배·발바닥으로 체온을 조절하며, 은은하게 확산되는 바람을 선호합니다.</p>
<p><b>환경을 찾아 이동하는 행동 특성</b><br>강아지는 헐떡임 같은 생리 반응 외에도, 더 적합한 환경을 스스로 찾아 이동하며 체온을 조절합니다.<br>휴식 장소를 고를 때도 열 조절과 그늘을 우선한다는 연구가 이를 뒷받침합니다.<br>&#x27;시원한 바닥으로 스스로 오게 만든다&#x27;는 설계 방향의 근거로 삼았습니다.</p>
<p><b>발바닥의 열 방출 구조</b><br>개의 발바닥은 모세혈관이 밀집한 열 손실 표면입니다.<br>바닥을 식히면 발바닥을 통해 효과적으로 체온을 낮출 수 있습니다.<br>이를 근거로 간접풍과 지면 냉각을 핵심 기제로 설정했습니다.</p></div>
<img loading="lazy" src="img/comong/07.jpg" alt="">
<img loading="lazy" src="img/comong/52.jpg" alt="">
<div class="ptext left"><p class="label">03 PAIN POINT</p>
<p><b>Problem 01 — 강아지를 위한 바람의 부재</b><br>기존 선풍기는 사람의 체감을 기준으로 설계되어 있습니다.<br>강아지의 신체 특성을 고려한 바람은 존재하지 않습니다.</p>
<p><b>Problem 02 — 혼자 있을 때의 시원함과 안전</b><br>보호자가 외출하면 문제는 더 커집니다.<br>선풍기를 켜두면 전선을 물어 생기는 감전·화재가 걱정되고, 에어컨을 켜두면 전기요금이 부담됩니다.<br>강아지가 혼자 있을 때 시원함과 안전을 동시에 지킬 방법이 없습니다.</p>
<p><b>Problem 03 — 함께 나누는 바람의 부재</b><br>사람과 강아지가 함께 있을 때는 바람의 세기와 방향을 매번 따로 맞춰야 합니다.<br>같은 공간 안에서 서로 다른 쾌적 조건을 충족하지 못합니다.</p>
<p><b>디자인 과제</b><br>사람과 반려견이 함께 있는 공간에서, 반려견에게도 안전하고 지속적인 시원함을 제공하는 것을 과제로 설정했습니다.</p></div>

<div class="ptext left"><p class="label">04 SOLUTION</p>
<p><b>COMONG</b><br>시원한 곳을 찾아 이동하는 강아지의 행동 특성에 기반한 AI 에어 멀티플라이어입니다.<br>위쪽은 사람을 위한 직접풍, 아래쪽은 강아지를 위한 은은한 바닥풍을 동시에 냅니다.<br>카메라와 지면 온도 센서로 강아지의 더위를 감지하고, 스스로 바람과 냉방을 조절합니다.</p>
<p><b>Stand &amp; Ground</b><br>Stand는 사람 눈높이의 직접풍으로, 팝업 75°와 회전 90°로 330° 범위를 커버합니다.<br>Ground는 강아지가 머무는 바닥을 식히는 간접풍으로, 상단 흡입구에서 들어온 공기가 하단 홀로 퍼집니다.</p>
<p><b>Smart Sync · Object Detection</b><br>강아지가 자주 머무는 바닥 위치를 인식해 해당 구역만 집중 냉각합니다.<br>헐떡임을 감지하면 더위 반응인지 판단해 에어컨과 연동합니다.</p></div>

<div class="ptext left"><p class="label">05 SCENARIO</p>
<p><b>페르소나</b><br>직장인 유정씨(32)의 말티즈 몽이는 하루 대부분을 혼자 집에서 보냅니다.<br>더위에 약한 몽이는 여름이면 시원한 곳을 찾아 거실을 서성입니다.</p>
<p><b>온보딩</b><br>앱을 처음 실행하면 반려견 정보를 입력합니다.<br>AI가 몽이에게 맞는 바람 세기와 바닥 온도를 자동으로 추천합니다.</p>
<p><b>외출 모드</b><br>출근 시간이 되면 AI 컴패니언이 일정 패턴을 읽고 외출 모드를 제안합니다.<br>COMONG은 몽이가 머무는 바닥 구역을 22°C로 낮추고 은은한 순환 바람을 만듭니다.<br>보호자는 별도의 조작 없이 집을 나설 수 있습니다.</p>
<p><b>혼자 있는 시간</b><br>더위를 피해 거실을 서성이던 몽이는 COMONG이 만든 시원한 바닥 존으로 스스로 이동합니다.<br>회사에서 유정씨는 앱으로 몽이의 상태를 확인합니다.</p>
<p><b>자동 냉방 연동</b><br>퇴근 후 저녁을 준비하는 사이 몽이가 더위를 느끼기 시작합니다.<br>카메라 센서가 헐떡임을 포착하고, 더위 반응으로 판단해 에어컨을 켭니다.<br>에너지를 아끼면서 몽이에게 맞는 시원함이 유지됩니다.</p>
<p><b>동반자 모드</b><br>식사 시간에는 위쪽은 유정씨를 위한 직접풍, 아래쪽은 몽이를 위한 바닥풍이 동시에 작동합니다.<br>같은 공간 안에서 서로 다른 시원함이 조화를 이룹니다.</p>
<p><b>데일리 리포트</b><br>잠들기 전 유정씨는 몽이가 머문 시간과 절약된 에너지를 확인합니다.<br>보호자와 반려견 모두에게 안전하고 시원한 여름을 제공합니다.</p></div>

<div class="ptext left"><p class="label">06 PRODUCT &amp; UX</p>
<p><b>눈높이 조작부</b><br>디스플레이와 작동부는 반려견의 손이 닿지 않는 사용자 눈높이에 있습니다.<br>제품 상단의 히든 디스플레이로 COMONG을 조작합니다.</p>
<p><b>자동 개폐 흡입구</b><br>상단 흡입구와 직접풍 팬은 오픈형 구조입니다.<br>카메라와 지면 온도 센서가 더위를 감지하면 흡입구가 자동으로 열립니다.</p>
<p><b>상단 흡입 · 하단 간접풍 구조</b><br>모터와 헤파 필터, 먼지 필터가 제품 상단에 위치합니다.<br>위에서 빨아들인 공기가 아래로 나가며 반려견 맞춤의 확장된 에어 서큘레이션을 그립니다.</p>
<p><b>오뚝이 전도 방지 구조</b><br>외출 중 발생할 수 있는 사고를 막기 위해 오뚝이 원리로 설계했습니다.<br>기울어져도 되돌아오며, 복귀 속도는 뎀퍼가 완화합니다.</p>
<p><b>전선 안전 설계</b><br>의료용 튜빙 계열 소재에 쓴맛을 더해 반려견이 전선을 갉는 것을 예방합니다.</p>
<p><b>유선 방식 선택</b><br>무선 서큘레이터의 최소 사용 시간은 2.7시간 수준입니다.<br>장시간 집을 비우는 외출 시나리오에는 부족해 유선을 택했습니다.</p>
<p><b>제품 사양</b><br>높이 135cm · 무게 12kg<br>구성 — 히든 디스플레이 · 카메라 · 온도 센서 · 흡입구 그릴 · 헤파 필터 · 모터 · 스탠드 블로우 그릴 · 그라운드 블로우 홀 · 뎀퍼 · 바퀴</p>
<p><b>전용 쿨매트 옵션</b><br>바닥풍의 시원함을 극대화하는 전용 쿨매트입니다.<br>나선형 구조로 은은한 바닥풍이 더 넓고 고르게 퍼집니다.</p></div>

<div class="ptext left"><p class="label">07 AI LOGIC</p>
<p><b>행동 기반 · 환경 기반 감지</b><br>행동 기반 감지는 영상 인식으로 강아지의 몸짓과 표정에서 더위를 읽습니다.<br>환경 기반 감지는 온도·습도·바닥 상태가 기준값을 넘는지 판단합니다.</p>
<p><b>4단계 열 스트레스 제어</b><br>환경 데이터와 행동 데이터를 함께 분석해 열 스트레스를 4단계로 분류합니다.<br>단계에 따라 바닥 냉각, 공기 흐름, 에어컨 연동을 자동 제어합니다.</p>
<p><b>사용 플로우</b><br>온보딩, 외출 모드, 동반자 모드 순으로 이어집니다.<br>사용자는 필요할 때만 전체 바람을 수동으로 조정합니다.</p></div>

<div class="ptext left"><p class="label">08 NEXT STEP</p>
<p><b>바닥 재질별 냉각 효율 연구</b><br>타일·마루 등 바닥 재질별 냉각 지속력과 온도 유지력을 리서치해 최적의 바닥풍 알고리즘을 찾습니다.</p>
<p><b>냉각 보조 모듈 확장</b><br>전용 냉각 매트를 보조 요소로 도입해 강아지가 더 오래 머무는 서드파티 확장 시스템으로 발전시킵니다.</p>
<p><b>사용자 검증 및 이터레이션</b><br>실제 반려가정 테스트로 강아지 반응, 보호자 신뢰, 직관성을 검증하고 피드백 이터레이션을 진행합니다.</p></div>

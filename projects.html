<p class="plabel">NEWTON</p>
<div class="pcap"><p class="pt">Now, Your Turn!</p><p class="pb">Newton은 꿈꾸던 스포츠 콘텐츠를 내가 있는 곳에서 바로 도전할 수 있는 경험으로 바꿉니다. 바닥과 벽면에 펼쳐진 움직임의 단서를 따라가며, 보고만 있던 멋진 동작을 내 몸으로 시도합니다. 하체 웨어러블은 움직임의 감각을 조율해, 낯선 움직임도 내 플레이로 이어가게 돕습니다.<br>송시헌, 이일여, 김소진, 박주원, 전다빈</p></div>
<img loading="lazy" src="img/newton/Newton_0_main.webp" alt="">
<p class="plabel">01 BACKGROUND</p>
<div class="pcap"><p class="pt"><span class="muted">From Routine to Challenge</span><br>운동은 해야 하지만 반복은 금방 지루해</p><p class="pb">운동이 필요하다는 사실은 누구나 알고 있습니다. 하지만 규칙적인 운동을 꾸준히 이어가는 일은 쉽지 않습니다. 운동은 귀찮고 해야 할 일처럼 느껴지며, 같은 루틴과 자세, 반복되는 기록 확인은 금세 지루해집니다. 사람들이 운동을 멈추는 것은 그 자체를 싫어해서가 아니라, 다시 움직이고 싶게 만드는 장면을 아직 만나지 못했기 때문입니다.</p></div>
<img loading="lazy" src="img/newton/Newton_1.jpg" alt="">
<div class="pcap"><p class="pt"><span class="muted">Challenge Spark</span><br>새로운 움직임은 다시 몸을 움직이게 한다</p><p class="pb">“나도 해 보고 싶다”라는 마음이 드는 순간, 운동은 다시 뜨거워집니다. 경기 막판의 스텝백, 링 위를 가르는 풋워크, 결승선까지 페이스를 잃지 않는 러너의 움직임처럼 시선을 빼앗는 장면은 보는 순간 몸을 움직이고 싶게 만듭니다.</p></div>
<img loading="lazy" src="img/newton/Newton_2.jpg" alt="">
<div class="pcap"><p class="pt"><span class="muted">Trend-to-Play Mover</span><br>타깃</p><p class="pb">Newton의 타깃은 멋진 움직임에 끌리고, 내가 있는 곳에서 바로 도전하고 싶은 라이트 액티브 유저입니다. 러닝 크루, 복싱 숏폼, 농구 하이라이트를 보며 해보고 싶다고 느끼는 사람들. 이들에게 운동은 숙제가 아니라, 저장하고 따라 해보고 싶은 추구미입니다.</p></div>
<img loading="lazy" src="img/newton/Newton_3.jpg" alt="">
<p class="plabel">02 CONCEPT</p>
<div class="pcap"><p class="pt"><span class="muted">Challenge Pack</span><br>움직임도 이제 고르고 구독하는 경험</p><p class="pb">프로의 스텝, 크리에이터의 루틴, 동호회 고수의 한 수까지. 따라 해 보고 싶은 움직임은 Challenge Pack이 됩니다. 지금 끌리는 Pack을 고르면, Newton은 그 움직임을 따라 해 볼 수 있는 단서로 펼쳐냅니다. 보고 저장해 둔 움직임은 벽면과 바닥, 야외 지면 위에 이어지고, 내가 있는 공간에서 바로 시작할 수 있는 도전이 됩니다.<br><a href="https://ilyeolee.github.io/newton-uxbook/" target="_blank" rel="noopener">▶ Newton의 전체 플레이 여정 보기</a></p></div>
<video src="img/newton/v_journey.mp4"></video>
<p class="plabel">03 HARDWARE SYSTEM</p>
<video src="img/newton/v_system.mp4"></video>
<div class="pcap"><p class="pt"><span class="muted">System</span><br>언제 어디서든 새로운 움직임에 도전할 수 있게</p><p class="pb">웨어러블 로봇 Newton을 중심으로 구성된 하드웨어 시스템은 반복되는 일상을 새로운 도전의 즐거움으로 채워주는 운동 파트너입니다. 내 움직임을 실시간으로 이해하고 분석하여 최적화된 물리적 보조를 제공하며, 언제 어디서든 멋진 움직임에 도전할 수 있는 필드를 펼쳐내어 누구나 쉽게 운동을 시작할 수 있도록 이끕니다.</p></div>
<img loading="lazy" src="img/newton/Newton_6.jpg" alt="">
<video src="img/newton/v_wearable.mp4"></video>
<div class="pcap"><p class="pt"><span class="muted">Newton</span><br>하체 웨어러블 로봇</p><p class="pb">Newton은 IMU 센서를 비롯한 다중 감각 센서를 통해 사용자의 움직임을 실시간으로 이해하고 돕는 웨어러블 로봇입니다. BLDC 모터를 기반으로 구성된 콤팩트한 장력 구조를 통해 사용자에게 최적화된 물리적 보조를 제공합니다. 이를 통해 관절과 근육의 부담을 최소화하고, 누구나 편안하고 안정적인 상태에서 운동 본연의 즐거움에 집중하게 합니다.</p></div>
<img loading="lazy" src="img/newton/Newton_8.jpg" alt="">
<div class="pcap"><p class="pt"><span class="muted">Core</span><br>어떤 곳이든 도전의 필드로 바꾸는 Core</p><p class="pb">Core 유닛은 Challenge Pack의 움직임을 레이저 빔 스캐닝(LBS) 방식으로 내가 있는 공간에 투사합니다. Newton과 Station에 연동해 책상 앞과 실내 벽면, 야외 지면 등 다양한 공간에 시각적 가이드를 펼치며, 해 보고 싶었던 움직임을 눈앞에서 직접 따라 할 수 있도록 돕습니다.</p></div>
<img loading="lazy" src="img/newton/Newton_9.jpg" alt="">
<div class="pcap"><p class="pt"><span class="muted">Station</span><br>도전을 시작할 준비를 돕는 Station</p><p class="pb">Station은 Newton을 충전하고 보관하는 거치형 허브입니다. 운동하지 않을 때는 하드웨어의 상태를 점검하고, 실내에서 Core 유닛이 놓일 위치와 투사 각도를 조정합니다. 다음 움직임은 이 자리에서 준비되고, 웨어러블 로봇을 착용하는 순간 새로운 도전으로 이어집니다.</p></div>
<img loading="lazy" src="img/newton/Newton_10.jpg" alt="">
<p class="plabel">04 SCENARIO</p>
<div class="pcap"><p class="pt"><span class="muted">(1) A Spark to Move</span><br>마음이 먼저 움직이는 순간</p><p class="pb">책상 앞에 오래 앉아 몸이 굳어 갈 때, Station은 지금 끌릴 만한 Challenge Pack을 짧게 띄웁니다. 어릴 때 배워 본 복싱의 회피 스텝과 펀치 하이라이트가 공간 위에 펼쳐지고, 투사된 시작 버튼은 다시 몸을 움직이고 싶은 마음을 끌어당깁니다. 버튼을 누르는 순간, 해야 할 운동은 지금 바로 해 보고 싶은 플레이로 바뀝니다.</p></div>
<video src="img/newton/v_s1.mp4"></video>
<img loading="lazy" src="img/newton/Newton_12.jpg" alt="">
<div class="pcap"><p class="pt"><span class="muted">(2) Play On, Step by Step</span><br>처음의 한 걸음은 집에서도 충분하니까</p><p class="pb">Pack을 고르면 방 안의 벽면이 조용한 링이 됩니다. 스트레칭으로 굳은 몸을 열고, 실내에서도 부담 없이 움직일 준비를 합니다. 벽에 떠오른 고수의 움직임을 따라 리듬을 익히고, 곧 짧은 스파링으로 실전 감각을 깨웁니다. 부담 없이 완성한 첫 플레이는 또 다른 움직임을 시작해 보고 싶은 마음을 남깁니다.</p></div>
<video src="img/newton/v_s2.mp4"></video>
<div class="pcap"><p class="pt"><span class="muted">Running</span><br>한번 움직인 마음은 바깥으로 이어진다</p><p class="pb">집에서 한 번 움직여 본 감각은 피드 속 러닝을 그냥 넘기지 못하게 만듭니다. 오늘은 션과 함께 달리는 러닝메이트 Pack을 골라 밖으로 나섭니다. 발밑에 이어지는 빛을 따라 페이스와 박자를 맞추고, 리듬이 흔들릴 때는 Boost On으로 다음 한 발에 힘을 더합니다. 피드에서 바라보던 러닝이 내 발밑에서 시작되는 순간, 익숙한 루틴은 따라가고 싶은 플레이가 됩니다.</p></div>
<video src="img/newton/v_s3.mp4"></video>
<div class="pcap"><p class="pt"><span class="muted">Basketball</span><br>혼자 익힌 리듬이 함께 움직일 자신감으로</p><p class="pb">혼자 움직이던 시간은 이제 친구들과 함께하는 플레이를 떠올리게 합니다. 오늘의 Pack은 스테판 커리의 스텝백. Newton은 첫 발과 백스텝, 복귀 리듬을 지면 위에 띄우고, Press On은 돌아오는 순간 묵직한 저항을 더해 순발력을 깨웁니다. 혼자 익힌 리듬은 친구들과 코트에 나서 보고 싶은 마음을 키우고, 운동은 어느새 함께 빠져드는 스포츠가 됩니다.</p></div>
<video src="img/newton/v_s4.mp4"></video>
<img loading="lazy" src="img/newton/Newton_16_edit.gif" alt="">
<div class="pcap"><p class="pt"><span class="muted">(3) From Movement to Momentum</span><br>오늘의 두근거림을 다음 도전으로</p><p class="pb">플레이가 끝난 뒤에도 오늘의 움직임은 다음을 향해 이어집니다. 리포트는 꿈꾸던 플레이와 가까워진 정도를 보여주며, 움직임의 성취를 새로운 도전의 가능성으로 확장합니다. 함께 뛰었던 Newton은 스테이션 위에서 충전되고, 땀에 닿은 패브릭 파츠는 세탁하여 산뜻하게 보관됩니다. 오늘의 감각은 다음 도전을 기다리는 설렘으로 남습니다.</p></div>
<video src="img/newton/v_s5.mp4"></video>
<img loading="lazy" src="img/newton/Newton_18.jpg" alt="">
<p class="plabel">05 OUTRO</p>
<div class="pcap"><p class="pt"><span class="muted">Every Turn Is Yours</span><br>누구나 자신의 차례를 믿고</p><p class="pb">Newton은 스포츠를 시작하고 도전하는 경험에서 출발합니다. 하지만 그 중심에는 하나의 종목이 아니라, 낯선 움직임을 내 몸의 속도로 시작하게 하는 구조에 있습니다. 그 가능성은 러닝, 복싱, 농구를 넘어 균형을 배우고 다시 걷는 감각을 회복하는 순간까지 확장될 수 있습니다. 누구나 자신의 차례를 믿고, 새로운 움직임에 도전할 수 있도록.</p></div>
<img loading="lazy" src="img/newton/Newton_19.jpg" alt="">
<div class="pcap"><p class="pt"><span class="muted">Find Your Movement</span><br></p><p class="pb"></p></div>
<video src="img/newton/v_outro.mp4"></video>
<img loading="lazy" src="img/newton/Newton_21.jpg" alt="">

<img loading="lazy" src="img/hotcake/01.png" alt="">
<div class="ptext"><p><b>Hotcak</b>e<br><b>Heat It, Play It, Hotcake</b><br><br>Hotcake lets you enjoy playing music with your friends, no matter where you are. It delivers rich, 3D sound that makes it feel like you are all in the same room. Hotcake keeps everyone perfectly in sync, so you can feel magical moments. Experience immersive, unforgettable jam sessions even in your home.</p><p><br></div>
<img loading="lazy" src="img/hotcake/02.jpg" alt="">
<div class="ptext"><p><br></p><p>Music is a part of everyday life. Some people want to truly engage and participate. Which means some people grab an instrument and begin their journey as a “bedroom musician’’.<br></p><p><br></div>
<img loading="lazy" src="img/hotcake/03.png" alt="">
<div class="ptext"><p><b>Music Comes Alive Together</b><br><br>Music is never complete when played alone. As different instruments come together, the sound becomes richer and more joyful. At first, you might play alone in your room, but before long, you’ll want to play with others. You just can’t fully experience the thrill of trading rhythms and locking into a groove when you’re playing solo.</p><p><br></div>
<img loading="lazy" src="img/hotcake/04.png" alt="">
<div class="ptext"><p>Jam sessions once meant going to a rehearsal studio — carrying heavy instruments, paying a fee, and feeling the pressure to perform perfectly. But what if you could play together from home? Hotcake offers a more relaxed and enjoyable way to connect. Play in your own space, and don’t worry if the beat slips or a note goes astray. Just let the music take over your soul.<br><br><a href="https://heyzine.com/flip-book/bf650f1c48.html#page/1" target="_blank" rel="noopener"><b>▶︎ More Detailed Story</b></a></p><p><br></div>
<div class="ptext"><p><br></p><p><b>Heat It, Play It, Hotcake</b></p><p><br></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110485351?h=89f8c2a04f&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<img loading="lazy" src="img/hotcake/05.png" alt="">
<img loading="lazy" src="img/hotcake/06.png" alt="">
<img loading="lazy" src="img/hotcake/07.png" alt="">
<div class="ptext"><p><b><br></b></p><p><b>Online Jam, Perfected Cake &amp; Butter</b><br><br>Hotcake includes Cake, a modular speaker and woofer system, and Butter, a wearable device that lets you feel the music. Hotcake turns the sounds from your jam session into immersive 3D audio, making it feel like you’re all playing in the same room. Butter also sends vibrations, so you can feel the beat as you play. </p><p></div>
<img loading="lazy" src="img/hotcake/08.jpg" alt="">
<img loading="lazy" src="img/hotcake/09.png" alt="">
<img loading="lazy" src="img/hotcake/10.png" alt="">
<div class="pgrid cols-2"><img loading="lazy" src="img/hotcake/11.jpg" alt=""><img loading="lazy" src="img/hotcake/12.png" alt=""></div>
<div class="ptext"><p><b><br></b></p><p><b>The Cake<br>Half a World Away, Still in Sync.</b></p><p>Perfect timing is very important for online jam sessions. Cake makes sure there is no delay or freezing, so everything feels smooth. Cake stays connected through a wired Ethernet, delivering real-time audio no matter the distance. Each module picks up the live sound from the station via a 2.4GHz RF channel, making sure your online jam feels smooth and perfectly in sync.</p><p><br></div>
<div class="pgrid cols-2"><img loading="lazy" src="img/hotcake/13.png" alt=""><img loading="lazy" src="img/hotcake/14.jpg" alt=""></div>
<div class="ptext"><p><b>The Butter<br>Adding Texture to Music.</b></p><p>What makes live music special is the way you can feel it in your body. Butter brings this feeling. It syncs haptics to the music you're playing, adding a rich layer to the sound. Also, you can switch to metronome mode to stay on beat or use the built-in mic to chat with others.</p><p><br></p><p><br></div>
<div class="pgrid cols-4"><img loading="lazy" src="img/hotcake/15.png" alt=""><img loading="lazy" src="img/hotcake/16.png" alt=""><img loading="lazy" src="img/hotcake/17.png" alt=""><img loading="lazy" src="img/hotcake/18.png" alt=""></div>
<div class="ptext"><p>⠀⠀</div>
<div class="pgrid cols-2"><img loading="lazy" src="img/hotcake/19.png" alt=""><img loading="lazy" src="img/hotcake/20.png" alt=""></div>
<div class="ptext"><p><b>Hotcake Scenario</b></p><p><b>(1) Connection with Sessions</b></p><p><br></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110647574?h=11795ee15e&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;%C2%80%C2%A8amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110648419?h=de446eb163&amp;badge=0&amp;autopause=0&amp;background=1&amp;%C2%80%C2%A8amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="ptext"><p><b><br></b></p><p><b>Your Instant Band, Anytime, Anywhere</b><br><br>If there is no one around to jam with, just open Hotcake’s community. You can find new bandmates who share your taste in music, or start a session with a friend from your list. Missing a player? An AI musician will jump in and play along with your rhythm, so you can always enjoy a full and immersive session.</p><p><br></div>
<div class="ptext"><p><b>(2) New Experience with Hotcake</b></p><p><b><br></b></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110485315?h=638bffcdb3&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110521104?h=95ad6cebf0&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;%C2%80%C2%A8amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="ptext"><p><b><br></b></p><p><b>A Live Experience with Light, Vibration, Sound</b><br><br>Set up modular speakers and experience more than just sound. Cake lights up in real time, so you can visually feel your friends’ performances as they play. Pair them with Butter, which is the wearable device. Feel the rhythm and groove through haptic.</p><p><br></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110650182?h=d60c2edb38&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110529439?h=c68dcc8912&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;%C2%80%C2%A8amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="ptext"><p><b><br></b></p><p><b>At Home, But Louder, More Fun</b><br><br>The best part of playing together is when everyone’s timing clicks. At this perfect moment, LED lights turn your room into a stage. When the music hits its peak, gesture motion triggers sound effects. So you can explore your jam session.</p><p><br></div>
<div class="ptext"><p><b>(3) Frame the Heated Moment</b></p><p><b><br></b></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110643864?h=3fed7b27cd&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;%C2%80%C2%A8amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<div class="ptext"><p><b>Return To The Heat Of The Jam</b><br><br>After the jam, AI automatically edits your solo parts and highlights them into a complete video. So, you can share it with your bandmates to keep the feeling going. Replay your performance and relive the spark of the session anytime.<br></p><p><br></div>
<div class="pgrid cols-2"><img loading="lazy" src="img/hotcake/21.png" alt=""><img loading="lazy" src="img/hotcake/22.png" alt=""></div>
<div class="ptext"><p><b><br></b></p><p><b>New Expandability<br>Playing Together, For Everyone</b><br><br>Hotcake becomes a platform where everyone can enjoy jamming, without changing how you normally play. For those who are deaf or hard of hearing to feel the rhythm, Butter features music haptics make you feel the rhythm through vibrations and join the session. Enjoy an immersive playing experience anytime, anywhere with Studio Mode headphones. It is a new music life, where your personal expression becomes part of the content.</p><p><br></div>
<div class="ptext"><p><b>Heat It, Play It, Groove It, Melt It, Drop It, </b></p><p><b>Fade It, Link It, Hotcak</b>e<br></p><p><br></div>
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110517768?h=e9c44a53e7&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;background=1&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>

<template id="proj-comong">
<p class="plabel">COMONG</p>
<div class="pcap"><p class="pt">강아지와 함께 쓰는 AI 에어 멀티플라이어</p><p class="pb">삼성디자인멤버십 × IDEO 프로젝트, Team 6.<br>Industrial Design 정민서(PL) · UX/UI 이일여 · BX 장유진 · 최완혁</p></div>
<img loading="lazy" src="img/comong/01.jpg" alt="">
<p class="plabel">01 BACKGROUND</p>
<div class="pcap"><p class="pt">냉방 사각지대의 반려견</p><p class="pb">가정의 냉방은 사람의 체감을 기준으로 이루어집니다.<br>같은 공간에서 여름을 보내는 반려견은 그 대상에서 빠져 있습니다.</p></div>
<img loading="lazy" src="img/comong/02.jpg" alt="">
<div class="pcap"><p class="pt">함께 여름을 나는 존재</p><p class="pb">집에서 함께 여름을 보내는 강아지에 주목했습니다.</p></div>
<img loading="lazy" src="img/comong/03.jpg" alt="">
<img loading="lazy" src="img/comong/04.jpg" alt="">
<div class="pcap"><p class="pt">검증의 출발점</p><p class="pb">선풍기 바람이 강아지에게 실제로 시원한지 확인하는 것에서 리서치를 시작했습니다.</p></div>
<img loading="lazy" src="img/comong/05.jpg" alt="">
<div class="pcap"><p class="pt">강아지의 체온 조절 방식</p><p class="pb">강아지는 땀을 흘리지 않고 혀와 발바닥으로 수분을 증발시켜 체온을 낮춥니다.<br>그래서 정면에서 부는 직접풍은 거의 시원하게 느껴지지 않습니다.<br>강아지의 특성을 고려한 냉방 제품이 필요합니다.</p></div>
<img loading="lazy" src="img/comong/07.jpg" alt="">
<p class="plabel">02 PAIN POINT</p>
<div class="pcap"><p class="pt">Problem 01 — 강아지를 위한 바람의 부재</p><p class="pb">기존 선풍기는 이 기본적인 특성을 고려하지 않습니다.<br>강아지를 위한 바람이 존재하지 않는 것이 첫 번째 문제입니다.</p></div>
<img loading="lazy" src="img/comong/09.jpg" alt="">
<div class="pcap"><p class="pt">Problem 02 — 혼자 있을 때의 시원함과 안전</p><p class="pb">보호자가 외출하면 문제는 더 커집니다.<br>선풍기를 켜두면 감전·화재가 걱정되고, 에어컨을 켜두면 전기요금이 부담됩니다.<br>강아지가 혼자 있을 때 시원하고 안전하게 지낼 방법이 없습니다.</p></div>
<img loading="lazy" src="img/comong/10.jpg" alt="">
<div class="pcap"><p class="pt">Problem 03 — 함께 나누는 바람의 부재</p><p class="pb">사람 중심으로 설계된 선풍기는 함께 있을 때마다 세기와 방향을 따로 맞춰야 합니다.<br>같은 공간에서 서로 다른 쾌적 조건을 충족하지 못합니다.</p></div>
<img loading="lazy" src="img/comong/11.jpg" alt="">
<div class="pcap"><p class="pt">디자인 과제</p><p class="pb">강아지가 함께 있는 공간에서, 사람과 마찬가지로 안전하고 지속적인 시원함을 제공하는 것을 과제로 설정했습니다.</p></div>
<img loading="lazy" src="img/comong/13.jpg" alt="">
<p class="plabel">03 SOLUTION</p>
<div class="pcap"><p class="pt">COMONG</p><p class="pb">시원한 곳을 찾아 이동하며 체온을 조절하는 강아지의 행동 특성과 환경 반응에 기반한 AI 에어 멀티플라이어를 제안합니다.</p></div>
<video src="img/comong/14.mp4" poster="img/comong/14.jpg"></video>
<video src="img/comong/15.mp4" poster="img/comong/15.jpg"></video>
<p class="plabel">04 SCENARIO</p>
<div class="pcap"><p class="pt">페르소나</p><p class="pb">직장인 유정씨(32)의 말티즈 몽이는 하루 대부분을 혼자 집에서 보냅니다.<br>더위에 약한 몽이는 여름이면 시원한 곳을 찾아 거실을 서성입니다.</p></div>
<img loading="lazy" src="img/comong/16.jpg" alt="">
<div class="pcap"><p class="pt">구매</p><p class="pb">유정씨는 &quot;강아지가 스스로 오게 만드는 선풍기&quot;라는 문구를 보고 COMONG을 주문하고 설치합니다.</p></div>
<img loading="lazy" src="img/comong/17.jpg" alt="">
<div class="pcap"><p class="pt">온보딩</p><p class="pb">앱을 처음 실행하면 반려견 정보를 입력합니다.<br>AI가 몽이에게 맞는 바람 세기와 바닥 온도를 자동으로 추천합니다.</p></div>
<video src="img/comong/18.mp4" poster="img/comong/18.jpg"></video>
<div class="pcap"><p class="pt">외출 모드</p><p class="pb">출근 시간이 되면 AI 컴패니언이 일정 패턴을 읽고 외출 모드를 제안합니다.<br>COMONG은 몽이가 머무는 바닥 구역을 22°C로 낮추고 은은한 순환 바람을 만듭니다.</p></div>
<video src="img/comong/19.mp4" poster="img/comong/19.jpg"></video>
<div class="pcap"><p class="pt">혼자 있는 시간</p><p class="pb">더위를 피해 거실을 서성이던 몽이는 COMONG이 만든 시원한 바닥 존으로 스스로 이동합니다.</p></div>
<video src="img/comong/20.mp4" poster="img/comong/20.jpg"></video>
<div class="pcap"><p class="pt">바닥 냉각</p><p class="pb">하단 온도 센서가 맞춘 시원한 바닥 위에서 몽이는 은은한 바람을 느끼며 머뭅니다.</p></div>
<video src="img/comong/21.mp4" poster="img/comong/21.jpg"></video>
<div class="pcap"><p class="pt">원격 확인</p><p class="pb">회사에서 유정씨는 앱으로 몽이의 상태를 확인합니다.</p></div>
<video src="img/comong/22.mp4" poster="img/comong/22.jpg"></video>
<div class="pcap"><p class="pt">안심</p><p class="pb">앱에서 몽이의 상태를 쉽게 확인할 수 있습니다.</p></div>
<video src="img/comong/23.mp4" poster="img/comong/23.jpg"></video>
<div class="pcap"><p class="pt">더위 감지</p><p class="pb">퇴근 후 저녁을 준비하는 사이 몽이가 더위를 느끼기 시작합니다.<br>카메라 센서가 이를 포착합니다.</p></div>
<video src="img/comong/24.mp4" poster="img/comong/24.jpg"></video>
<div class="pcap"><p class="pt">자동 냉방 연동</p><p class="pb">카메라 센서가 헐떡임을 감지해 더위 반응으로 판단하고 에어컨을 켭니다.<br>에너지를 아끼면서 몽이에게 맞는 시원함이 유지되고, 보호자에게 알림이 갑니다.</p></div>
<video src="img/comong/25.mp4" poster="img/comong/25.jpg"></video>
<div class="pcap"><p class="pt">이동</p><p class="pb">식사 준비를 마친 유정씨는 COMONG을 주방 옆으로 옮깁니다.</p></div>
<video src="img/comong/26.mp4" poster="img/comong/26.jpg"></video>
<div class="pcap"><p class="pt">동반자 모드</p><p class="pb">위쪽은 유정씨를 위한 직접풍, 아래쪽은 몽이를 위한 바닥풍이 동시에 작동합니다.<br>같은 공간 안에서 서로 다른 시원함이 조화를 이룹니다.</p></div>
<video src="img/comong/27.mp4" poster="img/comong/27.jpg"></video>
<div class="pcap"><p class="pt">데일리 리포트</p><p class="pb">잠들기 전 몽이가 머문 시간과 절약된 에너지를 확인합니다.<br>보호자와 반려견 모두에게 안전하고 시원한 여름을 제공합니다.</p></div>
<video src="img/comong/28.mp4" poster="img/comong/28.jpg"></video>
<p class="plabel">05 PRODUCT &amp; UX</p>
<div class="pcap"><p class="pt">눈높이 조작부</p><p class="pb">디스플레이와 작동부는 반려견의 손이 닿지 않는 사용자 눈높이에 있습니다.</p></div>
<img loading="lazy" src="img/comong/29.jpg" alt="">
<div class="pcap"><p class="pt">히든 디스플레이</p><p class="pb">COMONG을 조작하는 히든 디스플레이가 제품 상단에 있습니다.</p></div>

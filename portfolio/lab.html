<!DOCTYPE html>
<html lang="ko">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Coding Lab · Ilyeo Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --fg:#000; --muted:#7a7a7a; --line:#d9d9d9; --bg:#fff; --pad:7px; --fs:13px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); color:var(--fg); }
  body { font-family:Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size:var(--fs); line-height:1.4; letter-spacing:-0.005em; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; } a:hover { color:var(--muted); }
  .muted { color:var(--muted); }
  [hidden] { display:none !important; }
  .col-head { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; height:24px; padding:0 var(--pad); background:var(--bg); border-bottom:1px solid var(--line); }
  main { padding:40px clamp(16px,6vw,96px) 96px; }
  .foot { height:24px; display:flex; align-items:center; padding:0 var(--pad); border-top:1px solid var(--line); font-size:12px; }
  .pcap { display:grid; grid-template-columns:1fr 2fr; gap:28px; margin:26px 0 22px; align-items:start; }
  .pcap p { word-break:keep-all; overflow-wrap:anywhere; }
  .pt { font-size:24px; line-height:1.3; font-weight:600; letter-spacing:-0.02em; text-wrap:balance; }
  .pt .muted { display:block; font-size:var(--fs); line-height:18px; font-weight:500; letter-spacing:0; margin-bottom:8px; }
  .pb { font-size:16px; line-height:1.7; max-width:680px; text-wrap:pretty; padding-top:26px; }
  .item { display:grid; grid-template-columns:1fr 2fr; gap:28px; padding:40px 0; border-top:1px solid var(--line); scroll-margin-top:24px; }
  .item .no { color:var(--muted); display:block; margin-bottom:10px; }
  .item .pb { padding-top:12px; }
  .links { display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; }
  .chip { font:inherit; font-size:12px; line-height:1; padding:6px 10px; border:1px solid var(--fg); border-radius:999px; background:none; color:var(--fg); cursor:pointer; display:inline-block; transition:background .15s, color .15s; }
  .chip.on { background:var(--fg); color:var(--bg); }
  @media (hover:hover) { .chip:not(.on):hover { background:#f2f2f2; color:var(--fg); } }
  .live { position:relative; width:100%; aspect-ratio:16/10; overflow:hidden; background:#eee; }
  .live.phone { width:375px; max-width:100%; aspect-ratio:auto; height:760px; }
  .live img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s cubic-bezier(.2,.7,.2,1), filter .3s; }
  .live .run { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:none; border:0; font:inherit; cursor:pointer; }
  .live .run span { font-size:12px; line-height:1; padding:8px 14px; border-radius:999px; background:var(--fg); color:var(--bg); transition:transform .2s; }
  .live:hover img { transform:scale(1.02); filter:brightness(.92); }
  .live:hover .run span { transform:scale(1.06); }
  .live iframe { position:absolute; top:0; left:0; border:0; background:#fff; transform-origin:0 0; }
  .live.phone iframe { width:100%; height:100%; }
  .note { margin-top:8px; }
  section { scroll-margin-top:24px; }
  /* ---- full-screen project view: left rail of thumbs + wide project ---- */

  @media (max-width:900px) { .item { grid-template-columns:1fr; gap:16px; } .pcap { grid-template-columns:1fr; gap:12px; } .pt { font-size:20px; } .pb { font-size:15px; padding-top:0; } }
</style>
</head>
<body data-cursor="pixel">
<div class="col-head"><span>Vibe Coding Lab</span><a href="portfolio/">(Close)</a></div>
<main>
  <div class="pcap" style="margin-top:0;padding-bottom:40px"><p class="pt"><span class="muted">Vibe Coding Lab</span>직접 만들고 배포한 사이트</p><p class="pb">2026년에 Claude Code로 기획부터 배포까지 직접 만든 사이트를 모았습니다. 썸네일을 누르면 이 페이지 안에서 실제 사이트가 실행됩니다.</p></div>
  <div id="list"></div>
</main>
<div class="foot">© Ilyeo Lee 2026 All rights reserved. Designed and developed by Ilyeo Lee.</div>
<script>
const SITES=[
 {name:'멤보딩',phone:true,sound:true,url:'https://ilyeolee.github.io/gitsdm-vibecoding/',thumb:'img/lab/01p.webp',label:'',desc:'새 팀의 첫날을 협업 세팅 시간으로 바꾸는 온보딩 앱입니다. 이틀 동안 기획부터 배포까지 혼자 만들었습니다.',tags:'ChatGPT · 이미지·음악 생성',case:'memboarding'},
 {name:'{affinityDiagram}',newtab:true,url:'https://b1-saas.vercel.app',label:'0TO1',desc:'인터뷰 전사를 넣으면 단계마다 다른 AI로 발화를 추출하고 어피니티 다이어그램으로 묶는 리서치 툴입니다.',tags:'Next.js · Supabase · OpenAI',case:'zerotoone',note:'게스트 계정으로 바로 시작되도록 새 창에서 열립니다.'},
 {name:'DesignSync',url:'https://designsync-omega.vercel.app',label:'0TO1',desc:'디자인 시스템 토큰을 직접 바꿔 보고, 토큰 URL로 바이브 코딩 결과물에 이식하는 툴입니다.',tags:'shadcn/ui',case:'zerotoone'},
 {name:'Usability Tester',url:'https://usability-tester.vercel.app',label:'0TO1',desc:'localhost 결과물을 원클릭으로 배포하고, AI 페르소나로 1차 사용성 테스트를 돌리는 툴입니다.',tags:'',case:'zerotoone'},
 {name:'0TO1 Graphic Tool',url:'https://ilyeolee.github.io/0TO1-halftone/',label:'0TO1',desc:'0TO1의 소개 사이트이자, 픽셀 모티브와 메인 컬러를 조합해 발표용 그래픽을 뽑는 하프톤 그래픽 툴입니다.',tags:'React',case:'zerotoone'},
 {name:'NEWTON Simulator',url:'https://ilyeolee.github.io/newton-design-token-simulator/',label:'NEWTON',desc:'무릎에 단 프로젝터가 바닥에 훈련 UI를 투사하고 X봇 코치가 시범을 보이는 시뮬레이터입니다. 발자국·판정 링·화살표를 디자인 토큰으로 만들고, 몸이 움직여도 화면이 흔들리지 않게 하는 보정을 직접 켜고 끄며 검증했습니다.',tags:'Three.js',case:'newton'},
 {name:'NEWTON UX Book',url:'https://ilyeolee.github.io/newton-uxbook/',label:'NEWTON',desc:'뉴턴의 UX 전략, 시나리오, IA를 웹으로 정리한 프로세스북입니다.',tags:'',case:'newton'},
 {name:'AFTERSPACE Simulator',url:'https://ilyeolee.github.io/afterspace/',label:'AFTERSPACE',desc:'PBV 차량 실내 배치와 Care Yard 주차 배치를 한곳에서 직접 바꿔 보며 검토한 시뮬레이터입니다.',tags:'Three.js'},
];
const list=document.getElementById('list');
SITES.forEach((s,i)=>{
  const n=String(i+1).padStart(2,'0'), el=document.createElement('section'); el.id='s'+(i+1);
  const thumb=s.thumb||`img/lab/${n}.webp`;
  el.className='item';
  el.innerHTML=`<div><span class="no">${n}</span><p class="pt">${s.label?`<span class="muted">${s.label}</span>`:""}${s.name}</p><div class="pb"><p>${s.desc}</p>${s.tags?`<p class="muted note">${s.tags}</p>`:""}
  <div class="links">${s.newtab?'':'<button class="chip run-btn" type="button">여기서 실행</button>'}${s.sound?'<button class="chip snd" type="button" hidden>소리 켜기</button>':''}<a class="chip" href="${s.url}" target="_blank" rel="noopener">새 창으로 열기 ↗</a>${s.case?`<a class="chip" href="portfolio/#${s.case}">케이스 보기</a>`:''}</div>${s.note?`<p class="muted note">${s.note}</p>`:''}</div></div>
  <div class="live${s.phone?' phone':''}"><img src="${thumb}" alt="${s.name} 화면" loading="lazy">${s.newtab?`<a class="run" href="${s.url}" target="_blank" rel="noopener"><span>새 창에서 실행 ↗</span></a>`:'<button class="run" type="button"><span>▶ 여기서 실행</span></button>'}</div>`;
  list.appendChild(el);
  const live=el.querySelector('.live'), snd=el.querySelector('.snd');
  const src=muted=>s.sound?s.url+'?muted='+(muted?1:0):s.url;
  const run=()=>{ if(live.querySelector('iframe')) return; const f=document.createElement('iframe'); f.src=src(true); f.title=s.name; f.allow='fullscreen';
    if(!s.phone){ f.width=1440; f.height=900; f.style.width='1440px'; f.style.height='900px'; }
    live.replaceChildren(f); fit(); if(snd) snd.hidden=false; el.querySelector('.run-btn')?.remove(); };
  live.querySelector('button.run')?.addEventListener('click',run); el.querySelector('.run-btn')?.addEventListener('click',run);
  // sound starts off; turning it on reloads the app with autoplay allowed (needs this click as the user gesture)
  snd?.addEventListener('click',()=>{ const f=live.querySelector('iframe'); const on=!snd.classList.contains('on'); snd.classList.toggle('on',on); snd.textContent=on?'소리 끄기':'소리 켜기';
    f.allow=on?'autoplay; fullscreen':'fullscreen'; f.src=src(!on); });
});
const fit=()=>document.querySelectorAll('.live:not(.phone) iframe').forEach(f=>{ f.style.transform=`scale(${f.parentElement.clientWidth/1440})`; });
addEventListener('resize',fit);
if(location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
<script>
</script>
<script src="portfolio/cursor.js?v=2"></script>
</body>
</html>

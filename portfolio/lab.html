<!DOCTYPE html>
<html lang="ko">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Coding Lab · Ilyeo Lee</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --fg:#000; --muted:#7a7a7a; --line:#d9d9d9; --bg:#fff; --fs:13px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Inter, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size:var(--fs); line-height:1.4; color:var(--fg); background:var(--bg); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; } a:hover { color:var(--muted); }
  .bar { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; height:24px; padding:0 7px; background:var(--bg); border-bottom:1px solid var(--line); }
  main { padding:40px clamp(16px,6vw,96px) 96px; }
  .intro { display:grid; grid-template-columns:1fr 2fr; gap:28px; padding-bottom:40px; border-bottom:1px solid var(--line); }
  .intro h1 { font-size:32px; line-height:1.2; font-weight:600; letter-spacing:-0.02em; }
  .intro p { font-size:16px; line-height:1.7; max-width:680px; word-break:keep-all; padding-top:6px; }
  .item { scroll-margin-top:24px; display:grid; grid-template-columns:1fr 2fr; gap:28px; padding:40px 0; border-bottom:1px solid var(--line); }
  .meta .no { color:var(--muted); display:block; margin-bottom:10px; }
  .meta h2 { font-size:24px; line-height:1.3; font-weight:600; letter-spacing:-0.02em; word-break:keep-all; text-wrap:balance; }
  .meta p { font-size:16px; line-height:1.7; margin-top:12px; word-break:keep-all; text-wrap:pretty; }
  .meta .tags { color:var(--muted); margin-top:12px; }
  .meta .links { display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; }
  .chip { display:inline-block; font-size:12px; line-height:1; padding:7px 11px; border:1px solid var(--fg); border-radius:999px; }
  .chip:hover { background:var(--fg); color:var(--bg); }
  .frame { position:relative; width:100%; aspect-ratio:16/10; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#f6f6f6; }
  .frame iframe { position:absolute; top:0; left:0; width:1440px; height:900px; border:0; transform-origin:0 0; }
  .phone { width:375px; max-width:100%; height:760px; border:1px solid var(--line); border-radius:36px; overflow:hidden; background:#f6f6f6; }
  .phone iframe { width:100%; height:100%; border:0; display:block; }
  @media (max-width:900px) { .intro, .item { grid-template-columns:1fr; gap:16px; } .intro h1 { font-size:26px; } .meta h2 { font-size:20px; } .meta p { font-size:15px; } }
</style>
</head>
<body>
<div class="bar"><a href="portfolio/">← Selected Works</a><span>Vibe Coding Lab</span></div>
<main>
  <section class="intro">
    <h1>Vibe Coding Lab</h1>
    <p>Claude Code로 직접 만들고 배포한 사이트를 모았습니다. 모든 화면은 이미지가 아니라 실제로 돌아가는 사이트라, 이 페이지 안에서 바로 눌러 보고 써 볼 수 있습니다.</p>
  </section>
  <div id="list"></div>
</main>
<script>
const SITES=[
 {name:'멤보딩',kind:'phone',url:'https://ilyeolee.github.io/gitsdm-vibecoding/',desc:'새 팀의 첫날을 협업 세팅 시간으로 바꾸는 온보딩 앱입니다. 이틀 동안 기획부터 배포까지 혼자 만들었습니다.',tags:'2026 · ChatGPT · Claude Code · 이미지·음악 생성',case:'멤보딩'},
 {name:'{affinityDiagram}',url:'https://b1-saas.vercel.app',desc:'인터뷰 전사를 넣으면 단계마다 다른 AI로 발화를 추출하고 어피니티 다이어그램으로 묶는 리서치 툴입니다.',tags:'2026 · 0TO1 · Claude Code',case:'제로투원'},
 {name:'DesignSync',url:'https://designsync-omega.vercel.app',desc:'디자인 시스템 토큰을 직접 바꿔 보고, 토큰 URL로 바이브 코딩 결과물에 이식하는 툴입니다.',tags:'2026 · 0TO1 · shadcn/ui · Claude Code',case:'제로투원'},
 {name:'Usability Tester',url:'https://usability-tester.vercel.app',desc:'localhost 결과물을 원클릭으로 배포하고, AI 페르소나로 1차 사용성 테스트를 돌리는 툴입니다.',tags:'2026 · 0TO1 · Claude Code',case:'제로투원'},
 {name:'0TO1 Website & Graphic Tool',url:'https://ilyeolee.github.io/0TO1-halftone/',desc:'0TO1의 소개 사이트이자, 픽셀 모티브와 메인 컬러를 조합해 발표용 그래픽을 뽑는 하프톤 그래픽 툴입니다.',tags:'2026 · 0TO1 · React · Claude Code',case:'제로투원'},
 {name:'NEWTON Simulator',url:'https://ilyeolee.github.io/newton-design-token-simulator/',desc:'무릎에 단 프로젝터가 바닥에 훈련 UI를 투사하고 X봇 코치가 시범을 보이는 시뮬레이터입니다. 발자국·판정 링·화살표를 디자인 토큰으로 만들고, 몸이 움직여도 화면이 흔들리지 않게 하는 보정을 직접 켜고 끄며 검증했습니다.',tags:'2026 · NEWTON · Claude Code',case:'뉴턴'},
 {name:'NEWTON UX Book',url:'https://ilyeolee.github.io/newton-uxbook/',desc:'뉴턴의 UX 전략, 시나리오, IA를 웹으로 정리한 프로세스북입니다.',tags:'2026 · NEWTON',case:'뉴턴'},
 {name:'AFTERSPACE Simulators',url:'https://ilyeolee.github.io/afterspace/',desc:'PBV 실내 배치와 주차 배치를 직접 바꿔 보며 검토한 시뮬레이터 모음입니다.',tags:'2026 · AFTERSPACE · Claude Code'},
 {name:'PBV 룸 패키징',url:'https://ilyeolee.github.io/afterspace-pbv-room/',desc:'PBV 차량 실내의 라운지와 가구 배치를 3D로 바꿔 보는 시뮬레이터입니다.',tags:'2026 · AFTERSPACE · Claude Code'},
 {name:'Care Yard 배치도',url:'https://ilyeolee.github.io/care-yard-parking/',desc:'Care Yard의 주차 배치를 검토하는 배치도 툴입니다.',tags:'2026 · AFTERSPACE · Claude Code'},
];
const list=document.getElementById('list');
SITES.forEach((s,i)=>{
  const el=document.createElement('section'); el.className='item'; el.id='s'+(i+1);
  const frame=s.kind==='phone'?`<div class="phone"><iframe src="${s.url}" title="${s.name}" loading="lazy" allow="autoplay"></iframe></div>`:`<div class="frame"><iframe src="${s.url}" title="${s.name}" loading="lazy" allow="autoplay; fullscreen"></iframe></div>`;
  el.innerHTML=`<div class="meta"><span class="no">${String(i+1).padStart(2,'0')}</span><h2>${s.name}</h2><p>${s.desc}</p><p class="tags">${s.tags}</p><div class="links"><a class="chip" href="${s.url}" target="_blank" rel="noopener">새 창으로 열기 ↗</a>${s.case?`<a class="chip" href="portfolio/">${s.case} 케이스 보기</a>`:''}</div></div>${frame}`;
  list.appendChild(el);
});
// scale desktop iframes (rendered at 1440x900) to frame width
const fit=()=>document.querySelectorAll('.frame').forEach(f=>{ const i=f.querySelector('iframe'); i.style.transform=`scale(${f.clientWidth/1440})`; });
addEventListener('resize',fit); fit();
if(location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>

<template id="proj-newton">
<p class="plabel">NEWTON</p>
<div class="pcap"><p class="pt"><span class="muted">Samsung Design Membership MEP</span><br>Now, Your Turn!</p><p class="pb">Newton은 꿈꾸던 스포츠 콘텐츠를 내가 있는 곳에서 바로 도전할 수 있는 경험으로 바꿉니다. 바닥과 벽면에 펼쳐진 움직임의 단서를 따라가며, 보고만 있던 멋진 동작을 내 몸으로 시도합니다. 하체 웨어러블은 움직임의 감각을 조율해, 낯선 움직임도 내 플레이로 이어가게 돕습니다. 2026 삼성디자인멤버십 MEP 전시작으로 5인 팀이 만들었고, UX 전략과 시나리오, IA, 프로젝션 GUI, 검증 시뮬레이터 개발을 맡았습니다(UX 100%).</p></div>
<img width="3840" height="3600" decoding="async" loading="lazy" src="img/newton/Newton_0_main.webp" alt="">
<p class="plabel">01 BACKGROUND</p>
<div class="pcap"><p class="pt"><span class="muted">From Routine to Challenge</span><br>운동은 해야 하지만 반복은 금방 지루해</p><p class="pb">운동이 필요하다는 사실은 누구나 알고 있습니다. 하지만 규칙적인 운동을 꾸준히 이어가는 일은 쉽지 않습니다. 운동은 귀찮고 해야 할 일처럼 느껴지며, 같은 루틴과 자세, 반복되는 기록 확인은 금세 지루해집니다. 사람들이 운동을 멈추는 것은 그 자체를 싫어해서가 아니라, 다시 움직이고 싶게 만드는 장면을 아직 만나지 못했기 때문입니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/newton/Newton_1.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Challenge Spark</span><br>새로운 움직임은 다시 몸을 움직이게 한다</p><p class="pb">“나도 해 보고 싶다”라는 마음이 드는 순간, 운동은 다시 뜨거워집니다. 경기 막판의 스텝백, 링 위를 가르는 풋워크, 결승선까지 페이스를 잃지 않는 러너의 움직임처럼 시선을 빼앗는 장면은 보는 순간 몸을 움직이고 싶게 만듭니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/newton/Newton_2.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Trend-to-Play Mover</span><br>타깃</p><p class="pb">Newton의 타깃은 멋진 움직임에 끌리고, 내가 있는 곳에서 바로 도전하고 싶은 라이트 액티브 유저입니다. 러닝 크루, 복싱 숏폼, 농구 하이라이트를 보며 해보고 싶다고 느끼는 사람들. 이들에게 운동은 숙제가 아니라, 저장하고 따라 해보고 싶은 추구미입니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/newton/Newton_3.webp" alt="">
<p class="plabel">02 CONCEPT</p>
<div class="pcap"><p class="pt"><span class="muted">Challenge Pack</span><br>움직임도 이제 고르고 구독하는 경험</p><p class="pb">프로의 스텝, 크리에이터의 루틴, 동호회 고수의 한 수까지. 따라 해 보고 싶은 움직임은 Challenge Pack이 됩니다. 지금 끌리는 Pack을 고르면, Newton은 그 움직임을 따라 해 볼 수 있는 단서로 펼쳐냅니다. 보고 저장해 둔 움직임은 벽면과 바닥, 야외 지면 위에 이어지고, 내가 있는 공간에서 바로 시작할 수 있는 도전이 됩니다.<br><a href="https://ilyeolee.github.io/newton-uxbook/" target="_blank" rel="noopener">▶ Newton의 전체 플레이 여정 보기</a></p></div>
<video src="img/newton/v_journey.mp4" data-audio="1"></video>
<p class="plabel">03 HARDWARE SYSTEM</p>
<video src="img/newton/v_system.mp4" data-audio="1"></video>
<div class="pcap"><p class="pt"><span class="muted">System</span><br>언제 어디서든 새로운 움직임에 도전할 수 있게</p><p class="pb">웨어러블 로봇 Newton을 중심으로 구성된 하드웨어 시스템은 반복되는 일상을 새로운 도전의 즐거움으로 채워주는 운동 파트너입니다. 내 움직임을 실시간으로 이해하고 분석하여 최적화된 물리적 보조를 제공하며, 언제 어디서든 멋진 움직임에 도전할 수 있는 필드를 펼쳐내어 누구나 쉽게 운동을 시작할 수 있도록 이끕니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/newton/Newton_6.webp" alt="">
<video src="img/newton/v_wearable.mp4" data-audio="1"></video>
<div class="pcap"><p class="pt"><span class="muted">Newton</span><br>하체 웨어러블 로봇</p><p class="pb">Newton은 IMU 센서를 비롯한 다중 감각 센서를 통해 사용자의 움직임을 실시간으로 이해하고 돕는 웨어러블 로봇입니다. BLDC 모터를 기반으로 구성된 콤팩트한 장력 구조를 통해 사용자에게 최적화된 물리적 보조를 제공합니다. 이를 통해 관절과 근육의 부담을 최소화하고, 누구나 편안하고 안정적인 상태에서 운동 본연의 즐거움에 집중하게 합니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/newton/Newton_8.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Core</span><br>어떤 곳이든 도전의 필드로 바꾸는 Core</p><p class="pb">Core 유닛은 Challenge Pack의 움직임을 레이저 빔 스캐닝(LBS) 방식으로 내가 있는 공간에 투사합니다. Newton과 Station에 연동해 책상 앞과 실내 벽면, 야외 지면 등 다양한 공간에 시각적 가이드를 펼치며, 해 보고 싶었던 움직임을 눈앞에서 직접 따라 할 수 있도록 돕습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/newton/Newton_9.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Station</span><br>도전을 시작할 준비를 돕는 Station</p><p class="pb">Station은 Newton을 충전하고 보관하는 거치형 허브입니다. 운동하지 않을 때는 하드웨어의 상태를 점검하고, 실내에서 Core 유닛이 놓일 위치와 투사 각도를 조정합니다. 다음 움직임은 이 자리에서 준비되고, 웨어러블 로봇을 착용하는 순간 새로운 도전으로 이어집니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/newton/Newton_10.webp" alt="">
<p class="plabel">04 SCENARIO</p>
<div class="pcap"><p class="pt"><span class="muted">(1) A Spark to Move</span><br>마음이 먼저 움직이는 순간</p><p class="pb">책상 앞에 오래 앉아 몸이 굳어 갈 때, Station은 지금 끌릴 만한 Challenge Pack을 짧게 띄웁니다. 어릴 때 배워 본 복싱의 회피 스텝과 펀치 하이라이트가 공간 위에 펼쳐지고, 투사된 시작 버튼은 다시 몸을 움직이고 싶은 마음을 끌어당깁니다. 버튼을 누르는 순간, 해야 할 운동은 지금 바로 해 보고 싶은 플레이로 바뀝니다.</p></div>
<video src="img/newton/v_s1.mp4" data-audio="1"></video>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/newton/Newton_12.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">(2) Play On, Step by Step</span><br>처음의 한 걸음은 집에서도 충분하니까</p><p class="pb">Pack을 고르면 방 안의 벽면이 조용한 링이 됩니다. 스트레칭으로 굳은 몸을 열고, 실내에서도 부담 없이 움직일 준비를 합니다. 벽에 떠오른 고수의 움직임을 따라 리듬을 익히고, 곧 짧은 스파링으로 실전 감각을 깨웁니다. 부담 없이 완성한 첫 플레이는 또 다른 움직임을 시작해 보고 싶은 마음을 남깁니다.</p></div>
<video src="img/newton/v_s2.mp4" data-audio="1"></video>
<div class="pcap"><p class="pt"><span class="muted">Running</span><br>한번 움직인 마음은 바깥으로 이어진다</p><p class="pb">집에서 한 번 움직여 본 감각은 피드 속 러닝을 그냥 넘기지 못하게 만듭니다. 오늘은 션과 함께 달리는 러닝메이트 Pack을 골라 밖으로 나섭니다. 발밑에 이어지는 빛을 따라 페이스와 박자를 맞추고, 리듬이 흔들릴 때는 Boost On으로 다음 한 발에 힘을 더합니다. 피드에서 바라보던 러닝이 내 발밑에서 시작되는 순간, 익숙한 루틴은 따라가고 싶은 플레이가 됩니다.</p></div>
<video src="img/newton/v_s3.mp4" data-audio="1"></video>
<div class="pcap"><p class="pt"><span class="muted">Basketball</span><br>혼자 익힌 리듬이 함께 움직일 자신감으로</p><p class="pb">혼자 움직이던 시간은 이제 친구들과 함께하는 플레이를 떠올리게 합니다. 오늘의 Pack은 스테판 커리의 스텝백. Newton은 첫 발과 백스텝, 복귀 리듬을 지면 위에 띄우고, Press On은 돌아오는 순간 묵직한 저항을 더해 순발력을 깨웁니다. 혼자 익힌 리듬은 친구들과 코트에 나서 보고 싶은 마음을 키우고, 운동은 어느새 함께 빠져드는 스포츠가 됩니다.</p></div>
<video src="img/newton/v_s4.mp4" data-audio="1"></video>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/newton/Newton_16_edit.gif" alt="">
<div class="pcap"><p class="pt"><span class="muted">(3) From Movement to Momentum</span><br>오늘의 두근거림을 다음 도전으로</p><p class="pb">플레이가 끝난 뒤에도 오늘의 움직임은 다음을 향해 이어집니다. 리포트는 꿈꾸던 플레이와 가까워진 정도를 보여주며, 움직임의 성취를 새로운 도전의 가능성으로 확장합니다. 함께 뛰었던 Newton은 스테이션 위에서 충전되고, 땀에 닿은 패브릭 파츠는 세탁하여 산뜻하게 보관됩니다. 오늘의 감각은 다음 도전을 기다리는 설렘으로 남습니다.</p></div>
<video src="img/newton/v_s5.mp4" data-audio="1"></video>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/newton/Newton_18.webp" alt="">
<p class="plabel">05 OUTRO</p>
<div class="pcap"><p class="pt"><span class="muted">Every Turn Is Yours</span><br>누구나 자신의 차례를 믿고</p><p class="pb">Newton은 스포츠를 시작하고 도전하는 경험에서 출발합니다. 하지만 그 중심에는 하나의 종목이 아니라, 낯선 움직임을 내 몸의 속도로 시작하게 하는 구조에 있습니다. 그 가능성은 러닝, 복싱, 농구를 넘어 균형을 배우고 다시 걷는 감각을 회복하는 순간까지 확장될 수 있습니다. 누구나 자신의 차례를 믿고, 새로운 움직임에 도전할 수 있도록.</p></div>

<p class="plabel">HOTCAKE</p><div class="pcap"><p class="pt"><span class="muted">Heat It, Play It, Hotcake</span><br>어디서든 친구와 한 방에 있는 것처럼 합주하기</p><p class="pb">공간 음향 스피커 Cake와 햅틱 웨어러블 Butter로, 멀리 떨어진 친구와도 같은 방에 있는 것처럼 박자를 맞춰 합주하는 경험입니다. 2025 삼성디자인멤버십 MEP 전시작으로 5인 팀이 만들었고, 비주얼 디자이너로 합류했다가 UX 담당 팀원이 떠난 뒤 UI 비주얼과 UX를 함께 맡았습니다. Red Dot Design Concept 2026 Best of the Best, IDEA 2026 Gold를 받았습니다.</p></div>
<img width="1920" height="1920" decoding="async" fetchpriority="high" src="img/hotcake/01.webp" alt="">
<p class="plabel">01 BACKGROUND</p><div class="pcap"><p class="pt"><span class="muted">Bedroom Musician</span><br>듣는 데서 그치지 않고,<br>직접 연주하는 사람들</p><p class="pb">음악은 일상의 일부이고, 그중 일부는 직접 악기를 잡고 방에서 연주를 시작합니다(한국콘텐츠진흥원 2024 음악 이용자 조사 N=3,500, 어피티 2024 설문 N=660).</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/hotcake/02.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Together</span><br>음악은 함께할 때 완성된다</p><p class="pb">혼자 시작한 연주도 결국 다른 악기와 맞춰 보고 싶어집니다. 리듬을 주고받고 그루브를 맞추는 즐거움은 혼자서는 느낄 수 없습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/hotcake/03.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Pain Point</span><br>합주실까지 가는 길이 너무 멀다</p><p class="pb">합주하려면 무거운 장비를 들고 먼 합주실까지 가서, 매번 시간을 예약하고, 내 악기 대신 낯선 장비를 써야 했습니다. 집에서 부담 없이 함께 연주할 수 있다면 어떨까라는 질문에서 출발했습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/hotcake/04.webp" alt="">
<div class="pembed"><iframe src="https://player.vimeo.com/video/1110485351?h=89f8c2a04f&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
<p class="plabel">02 PRODUCT</p><div class="pcap"><p class="pt"><span class="muted">Cake & Butter</span><br>소리는 Cake로,<br>박자는 몸으로</p><p class="pb">Hotcake는 모듈형 스피커와 우퍼로 이뤄진 Cake, 음악을 몸으로 느끼게 하는 웨어러블 Butter로 구성됩니다. 합주 소리를 입체 음향으로 바꿔 같은 방에서 연주하는 느낌을 주고, Butter의 진동으로 박자를 느끼며 연주합니다.</p></div>
<img width="1920" height="1440" decoding="async" loading="lazy" src="img/hotcake/05.webp" alt="">

<div class="pcap"><p class="pt"><span class="muted">The Cake</span><br>지구 반대편에서도 맞는 박자</p><p class="pb">온라인 합주에서는 지연 없는 타이밍이 가장 중요합니다. Cake는 유선 이더넷으로 연결되어 거리와 상관없이 실시간으로 소리를 전하고, 각 모듈은 스테이션에서 2.4GHz RF로 소리를 받아 끊김 없이 박자를 맞춥니다.</p></div>

<div class="pcap"><p class="pt"><span class="muted">The Butter</span><br>몸으로 느끼는 음악</p><p class="pb">라이브의 특별함은 몸으로 느껴지는 데 있습니다. Butter는 연주에 맞춰 햅틱을 동기화하고, 메트로놈 모드로 박자를 잡거나 내장 마이크로 대화할 수 있습니다.</p></div>

<p class="plabel">SPURT</p><div class="pcap"><p class="pt"><span class="muted">Last Spurt for Procrastinators</span><br>미루는 사람을 위한 마지막 스퍼트</p><p class="pb">DEPROMEET 16기에서 디자이너 3명, 프론트엔드 4명, 백엔드 3명이 2025년 1월부터 4월까지 만든 집중 서비스입니다. 기획에 참여하고 GUI와 그래픽을 전담했으며 할 일 추가하기 화면을 맡았습니다(디자인 기여도 40%). App Store에 출시했습니다.</p></div>
<img width="1920" height="2562" decoding="async" fetchpriority="high" src="img/spurt/01.webp" alt="">
<p class="plabel">01 BACKGROUND</p><div class="pcap"><p class="pt"><span class="muted">Background</span><br>마감 10분 전의 후회</p><p class="pb">계획은 잘 세우지만 결국 미루다 급하게 처리하고 후회하는 패턴이 반복됩니다.</p></div>
<img width="1920" height="1434" decoding="async" loading="lazy" src="img/spurt/02.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Competitor</span><br>시작의 장벽을 다루는 앱이 없다</p><p class="pb">여러 생산성 앱은 할 일 관리에 집중할 뿐, 마감 직전의 불안과 시작의 장벽은 다루지 않았습니다.</p></div>
<img width="1920" height="1620" decoding="async" loading="lazy" src="img/spurt/03.webp" alt="">
<img width="1920" height="836" decoding="async" loading="lazy" src="img/spurt/04.webp" alt="">
<p class="plabel">02 RESEARCH</p><div class="pcap"><p class="pt"><span class="muted">Survey</span><br>알면서도 시작하지 못한다</p><p class="pb">자주 미루는 193명 설문에서 마감 직전 결과물이 기대에 못 미쳤고(51%) 스트레스가 컸습니다(50%). 시작이 어려운 가장 큰 이유는 마음먹기 어려워서(59.6%)였습니다.</p></div>
<img width="1920" height="3267" decoding="async" loading="lazy" src="img/spurt/05.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Interview & Desk Research</span><br>작은 행동, 여유 시간, 몰입 환경</p><p class="pb">9명 인터뷰와 데스크 리서치에서 세 가지를 얻었습니다. 작은 행동이 시작의 트리거가 되고(Ferrari의 지연행동 이론), 사람은 시간을 짧게 예측하므로 여유를 미리 둬야 하며(계획 오류), 시작한 뒤에는 음악이나 장소 같은 몰입 환경이 필요합니다.</p></div>
<img width="1920" height="3600" decoding="async" loading="lazy" src="img/spurt/06.webp" alt="">
<p class="plabel">03 HYPOTHESIS</p><div class="pcap"><p class="pt"><span class="muted">Hypothesis</span><br>여유 있게 시작하고,<br>몰입을 이어 가면</p><p class="pb">여유를 두는 할 일 추가, 가볍게 시작하게 하는 작은 행동 알림, 몰입을 끌어올리는 집중 화면을 세 핵심 기능으로 정했습니다.</p></div>
<img width="1920" height="2646" decoding="async" loading="lazy" src="img/spurt/07.webp" alt="">
<p class="plabel">04 USER TEST</p><div class="pcap"><p class="pt"><span class="muted">User Test</span><br>두 번의 테스트로 다시 짠 위계와 GUI</p><p class="pb">대면과 비대면으로 두 번 테스트했습니다. 긴급한 일이 안 보인다는 의견에 큰 카드로 강조해 위계를 다시 짰고, 작은 행동 알림은 다크 모드에서 긴급함이 사라지는 문제를 채도 높은 CTA로 풀었습니다.</p></div>
<img width="1920" height="7461" decoding="async" loading="lazy" src="img/spurt/08.webp" alt="">
<img width="1920" height="1040" decoding="async" loading="lazy" src="img/spurt/09.webp" alt="">
<p class="plabel">05 DESIGN</p><div class="pcap"><p class="pt"><span class="muted">Character</span><br>플라즈마 불꽃에서 태어난 스퍼티</p><p class="pb">막판 몰입의 힘을 표현하는 캐릭터 스퍼티를 24종으로 만들었습니다.</p></div>

<div class="pcap"><p class="pt"><span class="muted">Home</span><br>긴급한 일을 한눈에</p><p class="pb">남은 시간과 진행 상태를 카드로 보여 주고, 바로 몰입 화면으로 넘어갑니다.</p></div>
<img width="1920" height="2147" decoding="async" loading="lazy" src="img/spurt/14.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Add Task</span><br>여유 시간을 계산해 주는 할 일 추가</p><p class="pb">맡았던 할 일 추가에서는 마감일과 예상 시간을 넣으면 기본 1.5배(최대 3배)의 여유를 계산해 언제 시작할지 알려 주고, 마감 유형과 분위기를 고르면 몰입 캐릭터와 별명이 생깁니다.</p></div>

<div class="pcap"><p class="pt"><span class="muted">Action Nudge & Proof Shot</span><br>점점 급해지는 알림과 1분 인증</p><p class="pb">시작 시간이 되면 작은 행동 알림이 최대 3번 점점 급하게 울리고, 1분 안에 작은 행동을 사진으로 인증하면 바로 몰입 화면으로 넘어갑니다.</p></div>

<template id="proj-spot">
<p class="plabel">SPOT!</p><div class="pcap"><p class="pt"><span class="muted">My Ballpark View Service</span><br>야구장 좌석 시야와 직관 기록을 한곳에</p><p class="pb">DEPROMEET 15기에서 디자이너 3명, Android 4명, 서버 3명이 2024년 6월부터 9월까지 만든 서비스입니다. 기획에 참여하고 캐릭터 스케치와 GUI를 전담했으며 시야 찾기 화면을 메인으로 맡았습니다(디자인 기여도 40%). Google Play에 출시했고 15기 대상을 받았습니다.</p></div>
<img width="1920" height="2845" decoding="async" fetchpriority="high" src="img/spot/01.webp" alt="">
<p class="plabel">01 BACKGROUND</p><div class="pcap"><p class="pt"><span class="muted">Background</span><br>관중 900만 시대</p><p class="pb">2024년 프로야구 관중은 9,232,768명으로 2017년의 역대 최다(8,400,688명)를 넘었고, 20대 관중이 늘며 현장 열기도 뜨거워졌습니다.</p></div>
<img width="1920" height="1440" decoding="async" loading="lazy" src="img/spot/02.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Question</span><br>2만 석 중 내 자리는 어떻게 보일까</p><p class="pb">전국 야구장은 평균 20,800석이라, 예매할 때마다 고른 자리에서 경기가 어떻게 보일지 알기 어렵습니다.</p></div>
<img width="1920" height="1145" decoding="async" loading="lazy" src="img/spot/03.webp" alt="">
<p class="plabel">02 RESEARCH</p><div class="pcap"><p class="pt"><span class="muted">Survey</span><br>찾아보지만,<br>흩어져 있고 부족하다</p><p class="pb">야구 팬 252명 중 74.6%가 좌석 시야를 찾아본 적이 있었고, 예매 전후 모두 확인하는 사람도 42.6%였습니다. 하지만 정보가 흩어져 빨리 찾기 어렵고(24.4%), 원하는 리뷰와 사진이 부족했습니다(24%).</p></div>
<img width="1920" height="3740" decoding="async" loading="lazy" src="img/spot/04.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Interview</span><br>자세하지만 빠르게,<br>한 곳에서</p><p class="pb">6명 심층 인터뷰에서 응원 열기나 햇빛처럼 사진에 담기 어려운 요소까지 한 곳에서 빠르게 보고 싶다는 요구가 나왔습니다. 직관하는 팬은 경기 중 사진을 늘 찍어 갤러리에 이미 시야 사진을 갖고 있었습니다.</p></div>
<img width="1920" height="2947" decoding="async" loading="lazy" src="img/spot/05.webp" alt="">
<p class="plabel">03 HYPOTHESIS</p><div class="pcap"><p class="pt"><span class="muted">Hypothesis & MVP</span><br>팬이 이미 찍는 사진을 좌석별로 모으면</p><p class="pb">팬이 자주 찍는 사진을 좌석별로 모아 보여 주면 누구나 시야를 빠르게 확인할 수 있다고 가설을 세웠습니다. 1차 MVP는 쉬운 등록, 빠른 진입, 한눈에 보는 상세 정보에 집중했습니다.</p></div>
<img width="1920" height="2646" decoding="async" loading="lazy" src="img/spot/06.webp" alt="">
<p class="plabel">04 USER TEST</p><div class="pcap"><p class="pt"><span class="muted">User Test</span><br>6명 테스트로 고친 탐색 흐름</p><p class="pb">Maze와 피그마 프로토타입으로 6명에게 5가지 태스크를 테스트했습니다. 하단 내비게이션 진입이 적어 퀵메뉴로 바로 구장을 고르게 하고, 확대할 수 있다는 걸 몰라 설명 영역을 버튼으로 오인하는 문제는 확대 안내 배너와 구역 찾기 바텀시트로 풀었습니다. 고친 뒤 시야 찾기 진입 시간은 9.8초에서 1.69초로, 클릭 오류율은 95.5%에서 16.7%로 줄었습니다.</p></div>

<img width="1920" height="3546" decoding="async" loading="lazy" src="img/spot/08.webp" alt="">
<p class="plabel">05 DESIGN</p><div class="pcap"><p class="pt"><span class="muted">Character</span><br>업로드와 함께 자라는 야구공 캐릭터</p><p class="pb">업로드 수에 따라 직관 꿈나무에서 전설의 직관러까지 성장하는 야구공 캐릭터를 3D와 2D 그래픽으로 만들었습니다.</p></div>

<p class="plabel">BIBBI</p><div class="pcap"><p class="pt"><span class="muted">Family Daily Widget</span><br>하루 한 번,<br>가족에게 보내는 생존신고</p><p class="pb">DEPROMEET 14기 Team 05에서 디자이너 3명, iOS 4명, 서버 3명이 만든 위젯 서비스입니다. 기획과 위젯, 피드, 캘린더 UX/UI, 그래픽 전담, 마케팅을 맡았습니다(디자인 기여도 40%). App Store와 Google Play에 출시했고 14기 대상을 받았습니다.</p></div>

<p class="plabel">02 RESEARCH</p><div class="pcap"><p class="pt"><span class="muted">Survey</span><br>습관이 없고, 바쁘다</p><p class="pb">부모와 자녀 139명 설문에서 연락이 적은 이유는 습관이 없어서(50%)와 바빠서(41.2%)가 가장 많았습니다. 대화는 주로 일상 이야기(79.1%)였고, 논쟁적이거나 어려운 주제(각 40.3%)는 피하고 싶어 했습니다.</p></div>

<p class="plabel">03 CONCEPT</p><div class="pcap"><p class="pt"><span class="muted">Concept</span><br>하루 한 번의 생존신고</p><p class="pb">하루 한 번의 생존신고로 부모의 궁금함은 채우고 자녀의 연락 피로는 줄이는 컨셉에서 출발했습니다.</p></div>

<div class="pcap"><p class="pt"><span class="muted">Doubt</span><br>하루 한 번이면 충분할까</p><p class="pb">궁금한 게 많은 부모에게 하루 한 번이 적절한지 의문이 남았습니다. 그런데 63.5%가 부모가 먼저 연락한다고 답해, 자녀가 먼저 연락하지 않는 이유에 집중했습니다.</p></div>

<template id="proj-comong">
<p class="plabel">COMONG</p>
<div class="pcap"><p class="pt"><span class="muted">Samsung Design Membership × IDEO</span><br>강아지와 함께 쓰는 AI 에어 멀티플라이어</p><p class="pb">삼성디자인멤버십과 IDEO가 함께한 프로젝트로, 4인 팀에서 UX/UI를 맡았습니다(UX/UI 100%, BX는 별도 담당). 앱 온보딩과 외출 모드, 동반자 모드 플로우, AI 감지 로직, 시나리오, 발표 장표와 대본을 맡았고, Asia Design Prize 2026 Winner를 받았습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/comong/01.webp" alt="">
<p class="plabel">01 BACKGROUND</p>
<div class="pcap"><p class="pt"><span class="muted">Background</span><br>냉방 사각지대의 반려견</p><p class="pb">가정의 냉방은 사람의 체감을 기준으로 이루어집니다.<br>같은 공간에서 여름을 보내는 반려견은 그 대상에서 빠져 있습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/comong/02.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Focus</span><br>함께 여름을 나는 존재</p><p class="pb">집에서 함께 여름을 보내는 강아지에 주목했습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/comong/03.webp" alt="">
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/comong/04.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Research</span><br>검증의 출발점</p><p class="pb">선풍기 바람이 강아지에게 실제로 시원한지 확인하는 것에서 리서치를 시작했습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/comong/05.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Insight</span><br>강아지의 체온 조절 방식</p><p class="pb">강아지는 땀을 흘리지 않고 혀와 발바닥으로 수분을 증발시켜 체온을 낮춥니다.<br>그래서 정면에서 부는 직접풍은 거의 시원하게 느껴지지 않습니다.<br>강아지의 특성을 고려한 냉방 제품이 필요합니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/comong/07.webp" alt="">
<p class="plabel">02 PAIN POINT</p>
<div class="pcap"><p class="pt"><span class="muted">Problem 01</span><br>강아지를 위한 바람의 부재</p><p class="pb">기존 선풍기는 이 기본적인 특성을 고려하지 않습니다.<br>강아지를 위한 바람이 존재하지 않는 것이 첫 번째 문제입니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/comong/09.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Problem 02</span><br>혼자 있을 때의 시원함과 안전</p><p class="pb">보호자가 외출하면 문제는 더 커집니다.<br>선풍기를 켜두면 감전·화재가 걱정되고, 에어컨을 켜두면 전기요금이 부담됩니다.<br>강아지가 혼자 있을 때 시원하고 안전하게 지낼 방법이 없습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/comong/10.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Problem 03</span><br>함께 나누는 바람의 부재</p><p class="pb">사람 중심으로 설계된 선풍기는 함께 있을 때마다 세기와 방향을 따로 맞춰야 합니다.<br>같은 공간에서 서로 다른 쾌적 조건을 충족하지 못합니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/comong/11.webp" alt="">
<div class="pcap"><p class="pt"><span class="muted">Design Challenge</span><br>디자인 과제</p><p class="pb">강아지가 함께 있는 공간에서, 사람과 마찬가지로 안전하고 지속적인 시원함을 제공하는 것을 과제로 설정했습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/comong/13.webp" alt="">
<p class="plabel">03 SOLUTION</p>
<div class="pcap"><p class="pt"><span class="muted">Solution</span><br>COMONG</p><p class="pb">시원한 곳을 찾아 이동하며 체온을 조절하는 강아지의 행동 특성과 환경 반응에 기반한 AI 에어 멀티플라이어를 제안합니다.</p></div>

<p class="plabel">01 PROBLEM</p>
<div class="pcap"><p class="pt"><span class="muted">Problem</span><br>2년간 8번 바뀌는 팀,<br>매번 처음부터 다시 하는 자기소개</p><p class="pb">팀은 약 2개월 단위로 매칭, 첫날 온보딩, 프로젝트, 해산을 거치고 이 주기가 2년간 8번 반복됩니다. 그때마다 자기소개, 성향 공유, 시간 조율, 역할 합의를 처음부터 다시 했습니다. 팀원 인터뷰에서는 세 가지 불편이 반복해서 나왔습니다. 자기소개를 쓰는 데 매번 시간이 많이 들고, 공유한 성향이 정작 역할을 정할 때 쓰이지 않으며, 먼저 올라온 글을 보고 눈치를 보게 된다는 점입니다. 실제 팀 대화방에서도 같은 요청과 미안함이 프로젝트마다 반복됐습니다.</p></div>
<div class="wb wb-quotes"><blockquote>프로젝트마다 자기소개를 새로 쓰는데 매번 한 시간은 걸려요.<cite>김*은, VD 33기</cite></blockquote><blockquote>성향 얘기는 하는데 정작 역할 정할 때는 안 쓰여요.<cite>장*진, ID 33기</cite></blockquote><blockquote>아직 안 썼는데 선배들이 먼저 올려서 부담돼요.<cite>전*빈, UX 34기</cite></blockquote></div>
<div class="wb wb-2col" style="max-width:760px"><figure><img loading="lazy" src="img/memboarding/w/ev_dark.webp" alt=""><figcaption class="muted" style="margin-top:8px">프로젝트 시작 때마다 반복된 대화</figcaption></figure><figure><img loading="lazy" src="img/memboarding/w/ev_chat.webp" alt=""><figcaption class="muted" style="margin-top:8px">작성 부담과 눈치가 드러난 대화</figcaption></figure></div>
<p class="plabel">02 DEFINE · IA</p>
<div class="pcap"><p class="pt"><span class="muted">Define</span><br>첫 만남마다 반복되던 질문을 네 갈래로</p><p class="pb">인터뷰에서 모은 첫 만남의 질문을 내용별로 묶어 보니 네 갈래로 정리됐습니다. 대표 작업과 강점은 개인 정보로, 일하는 방식과 피드백 취향은 팀 이해로, 역할과 의사결정 방식은 협업 기준으로, 코어타임과 회의 시간은 팀 운영 기준으로 나눴습니다. 각 갈래를 내 작업 카드, 작업 성향 카드, 팀 얼라인 보드, 코어타임과 킥오프 카드라는 화면 기능에 하나씩 대응시켜, 한 사람이 답하면 팀 전체의 답이 한곳에 모이도록 구조를 잡았습니다.</p></div>
<div class="wb"><p class="wb-hmw">첫날을 어색한 소개 없이 일할 수 있는 협업 세팅으로 바꿀 수 있을까?</p><table class="wb-table"><tr><th>반복되던 대화</th><th>정보 갈래</th><th>화면 기능</th></tr><tr><td>대표 작업과 강점 소개</td><td>개인 정보</td><td>내 작업 카드</td></tr><tr><td>일하는 방식과 피드백 취향</td><td>팀 이해</td><td>작업 성향 카드</td></tr><tr><td>역할과 의사결정 방식</td><td>협업 기준</td><td>팀 얼라인 보드</td></tr><tr><td>코어타임과 회의 시간</td><td>팀 운영 기준</td><td>유동 코어타임과 킥오프 카드</td></tr></table></div>
<p class="plabel">03 ONBOARDING</p>
<div class="pcap"><p class="pt"><span class="muted">Onboarding</span><br>쓰는 대신 고르는 5단계 온보딩</p><p class="pb">빈칸에 쓰는 부담을 없애기 위해 모든 질문을 선택형으로 바꿨습니다. 프로젝트 유형과 인원을 고르고, 팀원은 명단에서 이름만 선택하며, 프로필은 직군에 따라 색이 자동으로 지정됩니다. 작업 성향은 키워드를 고른 직후 이유를 한 줄만 붙이게 해, 성향이 실제 협업 기준으로 이어지게 했습니다. 마지막 단계에서는 각자의 답이 팀 협업 약속으로 묶입니다.</p></div>
<div class="wb wb-screens" style="--n:5"><figure><img loading="lazy" decoding="async" src="img/memboarding/w/ob2.webp" alt="프로젝트 시작"><figcaption><b>프로젝트 시작</b><span class="muted">TF 유형과 인원부터 입력</span></figcaption></figure><figure><img loading="lazy" decoding="async" src="img/memboarding/w/ob1.webp" alt="팀원 선택"><figcaption><b>팀원 선택</b><span class="muted">이름은 명단에서 선택</span></figcaption></figure><figure><img loading="lazy" decoding="async" src="img/memboarding/w/ob4.webp" alt="내 프로필"><figcaption><b>내 프로필</b><span class="muted">역할별 색상 자동 지정</span></figcaption></figure><figure><img loading="lazy" decoding="async" src="img/memboarding/w/ob3.webp" alt="작업 성향"><figcaption><b>작업 성향</b><span class="muted">선택 직후 이유 한 줄</span></figcaption></figure><figure><img loading="lazy" decoding="async" src="img/memboarding/w/ob5.webp" alt="협업 약속"><figcaption><b>협업 약속</b><span class="muted">개인 답변을 팀 규칙으로</span></figcaption></figure></div>
<p class="plabel">04 TEAM DASHBOARD</p>
<div class="pcap"><p class="pt"><span class="muted">Team Dashboard</span><br>팀의 오늘을 한눈에 보는 홈</p><p class="pb">온보딩이 끝나면 정한 약속과 코어타임, 팀원 상황이 홈 하나에 모입니다. 홈에서는 팀원 캐릭터가 함께 달리며 진행 상황을 보여 주고, 약속, 일정, 멤버 항목을 누르면 각 화면으로 이어집니다. 코어타임은 각자 가능한 시간을 겹쳐 보여 줘 회의 시간을 바로 정할 수 있고, 첫날 합의한 약속은 항목별로 남아 프로젝트 중에도 다시 꺼내 볼 수 있습니다.</p></div>
<div class="wb wb-screens" style="--n:4"><figure><img loading="lazy" decoding="async" src="img/memboarding/w/db2.webp" alt="팀 대시보드 홈"><figcaption><b>팀 대시보드 홈</b><span class="muted">달리는 팀원 캐릭터와 대시보드</span></figcaption></figure><figure><img loading="lazy" decoding="async" src="img/memboarding/w/db4.webp" alt="팀 약속"><figcaption><b>팀 약속</b><span class="muted">첫날 합의를 항목별로 기록</span></figcaption></figure><figure><img loading="lazy" decoding="async" src="img/memboarding/w/db1.webp" alt="코어타임 일정"><figcaption><b>코어타임 일정</b><span class="muted">가능한 시간 겹쳐 보기</span></figcaption></figure><figure><img loading="lazy" decoding="async" src="img/memboarding/w/db3.webp" alt="멤버 탭"><figcaption><b>멤버 탭</b><span class="muted">팀원 목록과 상세 보기</span></figcaption></figure></div>
<p class="plabel">05 BUILD WITH AI</p>
<div class="pcap"><p class="pt"><span class="muted">AI Used Process</span><br>기획은 ChatGPT,<br>구현은 Claude Code</p><p class="pb">기획 단계에서는 ChatGPT로 기획 요청안과 기능 목록을 정리하고, HTML 문서로 묶어 참고 자료로 썼습니다. Pinterest에서 본디와 3D 방 앱 레퍼런스를 모으고, 제미나이 캔버스로 화면 뼈대를 먼저 만들었습니다. 구현 단계에서는 이미지 생성으로 움직이는 2D 배경이 되는지 검증한 뒤 코드를 Claude Code로 옮겨 기능과 UI를 만들고, 캐릭터와 레터링, 아이콘, BGM과 효과음까지 생성형 AI로 채웠습니다.</p></div>
<div class="wb"><p class="wb-group">생성형 AI로 기획과 화면 뼈대</p><ol class="wb-steps"><li><span class="wb-step-no">01</span><b>ChatGPT 기획</b><span class="muted">기획 요청안과 기능 목록 정리</span></li><li><span class="wb-step-no">02</span><b>HTML 문서화</b><span class="muted">A4 문서로 묶어 참고 자료로 활용</span></li><li><span class="wb-step-no">03</span><b>Pinterest</b><span class="muted">본디와 3D 방 앱 레퍼런스 수집</span></li><li><span class="wb-step-no">04</span><b>제미나이 캔버스</b><span class="muted">러프 개발로 화면 뼈대 제작</span></li></ol><p class="wb-group">Claude Code로 구현하고 에셋 채우기</p><ol class="wb-steps"><li><span class="wb-step-no">05</span><b>이미지 생성</b><span class="muted">움직이는 2D 배경 가능성 검증</span></li><li><span class="wb-step-no">06</span><b>클로드 코드</b><span class="muted">코드 이식 후 기능과 UI 구현</span></li><li><span class="wb-step-no">07</span><b>에셋 고도화</b><span class="muted">캐릭터와 레터링, 아이콘 제작</span></li><li><span class="wb-step-no">08</span><b>효과음 삽입</b><span class="muted">BGM과 CTA 사운드, 응원음 제작 후 삽입</span></li></ol></div>
<p class="plabel">06 CHARACTERS</p>
<div class="pcap"><p class="pt"><span class="muted">Characters</span><br>PL, ID, UX, VD 멤버를 닮은 네 캐릭터</p><p class="pb">기본 캐릭터 하나를 두고 직군마다 색과 소품만 바꿔 달라고 요청해, 멤버십의 네 직군을 닮은 캐릭터를 만들었습니다. PL은 왕관과 별, ID는 연필과 종이 목업, UX는 하트 배지와 문서, VD는 꽃과 컬러칩을 들고 있습니다. 걷기 동작은 접지, 하강, 통과, 상승 네 동작을 기준으로 설계하고 PNG 5장으로 구현했습니다.</p></div>
<div class="wb wb-chars"><figure><img loading="lazy" src="img/memboarding/w/walk_PL.webp" alt="PL"><b>PL</b><span class="muted">왕관과 별을 든 캐릭터, 팀을 이끄는 PL</span><q>기본 캐릭터 그대로 두고 핑크로 바꿔줘. 머리에 왕관 씌우고 별모양으로 그려줘</q></figure><figure><img loading="lazy" src="img/memboarding/w/walk_ID.webp" alt="ID"><b>ID</b><span class="muted">연필과 종이 목업, 공작실에서 목업을 만드는 ID</span><q>파란색으로 바꾸고 자랑 연필 들려줘. 옆에 종이 목업 하나 놔줘</q></figure><figure><img loading="lazy" src="img/memboarding/w/walk_UX.webp" alt="UX"><b>UX</b><span class="muted">하트 배지와 문서, 사용자 이야기를 먼저 듣는 UX</span><q>주황색으로 바꾸고 폰 프로토타입 들려줘. 하트 배지랑 문서 몇 장 추가</q></figure><figure><img loading="lazy" src="img/memboarding/w/walk_VD.webp" alt="VD"><b>VD</b><span class="muted">꽃과 컬러칩, 색과 형태를 다듬는 VD</span><q>노란색으로 바꾸고 컬러칩 펼쳐서 들려줘. 머리에 꽃 하나 꽂아줘</q></figure></div>
<div class="pcap"><p class="pt"><span class="muted">Validation</span><br>매일 지나던 멤버십 복도를 걷는 2D 캐릭터</p><p class="pb">처음에는 3D 공간을 시도했지만 무료 모델로는 인체 모형이나 로봇 정도밖에 없어 어색했습니다. 그래서 멤버십 건물 안을 직접 찍어 배경으로 쓰고, 캐릭터가 자연스럽게 걷는지와 배경이 끊기지 않는지만 하루 만에 확인했습니다. 배경과 가구를 서로 다른 층으로 나눠 다른 속도로 흘려, 계속 움직여도 끊기지 않고 깊이감이 생깁니다. 아래 장면이 실제로 그 방식으로 움직입니다.</p></div>
<div class="wb wb-stage"><div class="obj"></div><div class="walkers"><img src="img/memboarding/w/walk_PL.webp" alt=""><img src="img/memboarding/w/walk_ID.webp" alt=""><img src="img/memboarding/w/walk_UX.webp" alt=""><img src="img/memboarding/w/walk_VD.webp" alt=""></div></div>
<p class="plabel">07 DATA PIPELINE</p>
<div class="pcap"><p class="pt"><span class="muted">Data Pipeline</span><br>사진과 직군 표만 넣으면 58명이 걸어 다니는 구조</p><p class="pb">멤버십 동기 58명을 모두 캐릭터로 걷게 하려고, 얼굴 사진은 폴더에 넣고 이름과 직군(ID 27명, UX 31명)은 MD 파일에 한 줄씩 적었습니다. Claude Code가 파일 이름으로 사람을 찾고, 표에서 직군을 읽어 직군 색에 맞는 캐릭터를 조립합니다. MD 한 줄이 캐릭터 한 명이라, 인원이 늘어도 파일만 추가하면 되고 화면 코드는 손대지 않았습니다.</p></div>
<div class="wb wb-flow"><div class="box"><p class="muted">INPUT</p><p>/faces 얼굴 크롭 58장</p><p>roles.md 이름과 직군 (ID 27, UX 31)</p><p>/walk 걷기 동작 20장</p><p>/bg 루프 배경 레이어 5장</p></div><span class="arr">→</span><div class="box"><p class="muted">PROCESS</p><p>파일 이름에서 사람을 읽고</p><p>MD 표에서 직군을 찾아</p><p>직군 색으로 캐릭터를 조립</p></div><span class="arr">→</span><div class="box"><p class="muted">OUTPUT</p><div class="walk"><img src="img/memboarding/w/walk_PL.webp" alt=""><img src="img/memboarding/w/walk_ID.webp" alt=""><img src="img/memboarding/w/walk_UX.webp" alt=""><img src="img/memboarding/w/walk_VD.webp" alt=""></div><p class="muted">MD 한 줄이 캐릭터 한 명</p></div></div>
<p class="plabel">08 ASSETS</p>
<div class="pcap"><p class="pt"><span class="muted">Lettering · Icon · Sound · GUI</span><br>게임처럼 통통 튀는 화면 한 벌</p><p class="pb">레터링은 게임 간판 레퍼런스와 허용 팔레트 4색을 기준으로 타이틀, 버튼, 인게임 문구의 톤을 맞췄습니다. 아이콘은 원본 라인 아이콘 21종을 한 번에 넘겨 뜻과 형태는 그대로 두고 재질만 게임 톤으로 바꿨습니다. 소리는 배경음악, 버튼 터치, 응원 박수 순간을 나눠 각각 다른 성격의 소리를 골랐습니다. GUI는 주아체, 광택 버튼, 크림 카드, 자간을 CSS 변수 한 벌로 묶어, 화면이 늘어도 톤이 흔들리지 않게 했습니다.</p></div>

<p class="plabel">01 BACKGROUND</p><div class="pcap"><p class="pt"><span class="muted">The Way We Called AI</span><br>AI를 먼저 깨우던 시대</p><p class="pb">우리는 오랫동안 AI를 ‘부르는 방식’에 익숙해져 있었습니다. “Hey 빅스비”라고 말을 걸거나, 물리적 AI 버튼을 누르고, 화면 위에 직접 그려 넣는 제스처로 AI를 깨워왔죠. 하지만 생각해보면, 우리는 매번 말, 버튼, 인터렉션으로 먼저 AI를 깨우고 있었던 건 아닐까요?</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/gha/01.webp" alt="음성, 버튼, 인터랙션으로 AI를 부르는 세 가지 방식">
<div class="pcap"><p class="pt"><span class="muted">AI that comes when called is always one beat late</span><br>늘 한 박자 늦는 AI</p><p class="pb">직접 AI를 호출하는 경험은 여전히 어색하고, 때로는 부정적으로 인식됩니다. 70%의 사용자가 “AI를 부르는 행위 자체가 번거롭다”고 느꼈죠. 반면, 78%의 사용자는 스스로 상황을 파악해 먼저 도와주는 AI를 원하고 있습니다. 결국, 부르면 오는 AI의 도움은 늘 — 한 박자 늦습니다. 사용자가 요청하기 전에 먼저 이해하고 반응하는 경험, 이제 AI에게 필요한 것은 ‘능동적 감각’입니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/gha/02.webp" alt="AI 호출 경험에 대한 설문 결과">
<div class="pcap"><p class="pt"><span class="muted">Half a Step Ahead</span><br>호출이 아닌 등장,<br>사용자를 반 걸음 앞서 돕는 Proactive AI</p><p class="pb">AI는 더 이상 사용자가 먼저 부르는 존재가 되어서는 안 됩니다. “Hey, AI”라고 불러야 움직이는 수동적 시스템이 아니라, 사용자의 맥락을 이해하고 반 걸음 앞서 다가오는 존재여야 합니다. 이제 AI는 호출의 대상이 아니라, 등장의 순간으로 재정의됩니다. 필요할 때 스스로 나타나고, 말하지 않아도 흐름 속에서 도움을 주는 — 그것이 제안하는 Proactive AI 인터랙션입니다.</p></div>
<div class="pvimeo" data-src="https://player.vimeo.com/video/1148615879?h=31d634f17d&amp;title=0&amp;byline=0&amp;portrait=0&amp;badge=0" data-title="Glance, Hint, Act. 브랜드 필름"><img src="img/gha/vbrand.webp" alt="Glance, Hint, Act. 브랜드 필름" loading="lazy"><button class="play" type="button"><span>▶ 재생</span></button></div>
<div class="pcap"><p class="pt"><span class="muted">When Help Lacks Context, It Feels Intrusive</span><br>맥락 없는 친절은 불편함이 된다</p><p class="pb">AI가 먼저 다가온다고 해서 모두 환영받는 것은 아닙니다. 맥락 없이 앞서 나서는 도움은 오히려 낯설고, 때로는 불편하게 느껴지죠. 조사에 따르면 자율적으로 행동하는 AI를 선호하는 사용자는 9.6%에 불과했습니다. 많은 이들이 여전히 개인정보 침해, 시스템 불신, 스스로 결정하고 싶은 욕구를 이유로 AI의 ‘선제적 개입’을 주저합니다. 결국, AI의 친절함도 맥락 위에서만 의미를 갖습니다.</p></div>
<video src="img/gha/07.mp4?v=2" poster="img/gha/07.webp?v=2" width="1920" height="848" muted loop playsinline></video>
<p class="plabel">02 RESEARCH</p><div class="pcap"><p class="pt"><span class="muted">User Workshop Overview</span><br>사용자 워크숍 개요</p><p class="pb">워크숍은 총 3일간 진행되었으며, Figma Jam을 활용한 비대면 3회, 대면 1회 세션으로 구성하였습니다. 총 6명의 20대 참여자가 참여하였으며, AI 기능 경험과 스마트폰 숙련도가 다양한 사용자를 중심으로 선정하였습니다. 1:1 인터뷰와 그룹 워크숍을 병행하여 AI 개입에 대한 개인적 인식과 집단적 반응을 함께 탐색하였습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/gha/05.webp" alt="사용자 워크숍 보드와 참여자 구성">
<div class="pcap"><p class="pt"><span class="muted">Finding the Right Moment for AI Intervention</span><br>AI 개입의 ‘적절한 순간’을 찾기 위한 사용자 워크숍</p><p class="pb">AI가 언제, 어떻게 개입해야 자연스러운지를 알아보기 위해 사용자가 스스로 ‘AI 개입의 허용선’을 정하는 워크숍을 진행하였습니다. 참여자들은 카드 소팅으로 개입이 필요한 상황과 불편한 상황을 구분하고, 닷 보팅으로 우선순위와 금지 기준을 정했습니다. 또한 히트맵을 통해 화면 위에서 허용 가능한 개입 영역을 시각화하였습니다. 이를 통해 AI가 언제 먼저 다가와야 하는가에 대한 사용자의 명확한 기준을 도출할 수 있었습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/gha/06.webp" alt="카드 소팅, 닷 보팅, 히트맵 워크숍">
<div class="pcap"><p class="pt"><span class="muted">Workshop Findings</span><br>워크숍 결과 요약</p></div>
<video src="img/gha/08.mp4?v=1" poster="img/gha/08.webp?v=1" width="2400" height="1440" muted loop playsinline></video>
<p class="plabel">03 INSIGHT</p><div class="pcap"><p class="pt"><span class="muted">Insight 01. When to Approach</span><br>AI 개입의 적정 시점</p><p class="pb">AI가 먼저 다가올 때, 그 타이밍과 맥락이 맞으면 사용자는 긍정적으로 받아들입니다. 그러나 그 개입이 사적인 영역을 넘어서면 오히려 거부감과 피로를 느끼게 됩니다.</p></div>
<img width="2880" height="1275" decoding="async" loading="lazy" src="img/gha/09i.webp" alt="Accepted Zone과 Rejected Zone">
<div class="pcap"><p class="pt"><span class="muted">Insight 02. How to Approach Visually</span><br>AI 제안의 시각적 위치 원칙</p><p class="pb">AI의 제안은 모서리나 주변부에 위치할수록 사용자의 시야를 방해하지 않아 인지 부담이 적습니다. 반대로, 핵심 메시지는 시선이 닿기 쉬운 위치에 배치되며, 필요한 경우에만 중앙 배치가 허용됩니다.</p></div>
<video src="img/gha/10.mp4?v=1" poster="img/gha/10.webp?v=1" width="2400" height="1350" muted loop playsinline></video>
<p class="plabel">04 SOLUTION</p><div class="pcap"><p class="pt"><span class="muted">Solution. Designing the Flow</span><br>프로액티브 AI의 등장 흐름 설계</p><p class="pb">이전 연구에서 사용자는 AI의 개입 시점과 시각적 위치에 따라 긍정과 거부의 감정이 명확히 달라진다는 인사이트가 도출되었습니다. 이를 바탕으로, AI가 언제, 어떻게 등장해야 하는가에 대한 구체적인 UX 흐름을 Glance–Hint–Act 세 단계로 설계했습니다.</p></div>
<video src="img/gha/11.mp4?v=1" poster="img/gha/11.webp?v=1" width="2400" height="1062" muted loop playsinline></video>
<div class="pcap"><p class="pt"><span class="muted">From Visual to Sensory: A New Way AI Appears</span><br>시각적 존재에서 감각적 존재로:<br>AI 등장 방식의 전환</p><p class="pb">AI는 강한 색과 그래디언트 중심의 시각적 등장 대신, 먼저 ‘빛’으로 조용히 감지되는 존재로 재해석됩니다. 밝은 환경에서도 자연스럽게 드러나며, 주변 UI와 연동되는 빛의 반응을 통해 맥락 있는 존재감을 형성합니다. 색은 클릭 이후에만 드러나는 2차 감각으로 남아, 전체 경험은 부담 없이 부드럽게 이어집니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/gha/12.webp" alt="As-Is 색 중심 AI 등장과 To-Be 빛으로 먼저 감지되는 AI">
<div class="pcap"><p class="pt"><span class="muted">AI in the Spectrum of Light</span><br>빛의 스펙트럼으로 드러나는 Proactive AI</p><p class="pb">프로액티브 AI의 존재감은 사용자의 시선을 방해하지 않되, 필요한 순간에는 빛처럼 명확하게 드러나야 합니다. 이를 위해 ‘빛의 시간대’를 모티프로 삼아, AI의 개입 강도를 시각적으로 조절할 수 있도록 정의했습니다.</p></div>
<video src="img/gha/13.mp4?v=1" poster="img/gha/13.webp?v=1" width="1920" height="850" muted loop playsinline></video>
<img width="2880" height="1620" decoding="async" loading="lazy" src="img/gha/14.webp?v=2" alt="Glance, Hint, Act. 로고타입">
<p class="plabel">05 SCENARIO</p><div class="pcap"><p class="pt"><span class="muted">Eight Everyday Scenarios of Proactive AI</span><br>프로액티브 AI를 위한 8개의 일상 시나리오</p><p class="pb">이번 프로젝트는 프로액티브 AI가 자연스럽게 등장할 수 있는 8개의 일상 상황을 선별해 흐름을 설계했습니다. 선정 기준은 필드 리서치에서 우선순위가 높았던 문제, 전시에서 직관적으로 보이는 장면, 디자인으로 해결 가능한 맥락이었습니다. 또한, 1–2번 시나리오는 폴드의 Split 경험, 나머지 6개는 세로 UI로 구성했습니다. 총 8개의 시나리오는 모두 사용자가 부르지 않아도 먼저 돕는 AI라는 하나의 비전을 담고 있습니다.</p></div>
<img width="1920" height="1080" decoding="async" loading="lazy" src="img/gha/15.webp" alt="8개 일상 시나리오 개요">
<div class="pcap"><p class="pt"><span class="muted">Scenario 01. Chatting with a friend while choosing running shoes</span><br>친구와 메신저하며 러닝화를 고르는 순간</p><p class="pb">A, B 러닝화 중 뭐가 더 나을까? 친구와 어떤 러닝화를 살지 대화하며 고민하는 순간, AI가 그 흐름을 자연스럽게 읽어 두 제품의 가격·디자인·스펙을 한눈에 보이게 정리해 주고, 요약을 채팅에 바로 붙여넣거나 더 깊게 비교할 수 있도록 편하게 이어줍니다.</p></div>

<div class="pcap"><p class="pt"><span class="muted">Scenario 02. Following IKEA Assembly Videos</span><br>이케아 영상을 따라하며 가구를 조립할 때</p><p class="pb">영상을 보며 따라 할 때는 필요한 부분을 놓치기 쉽고, 막히면 다시 검색하느라 흐름이 끊기곤 합니다. AI가 조립 영상을 단계별 텍스트와 구간별 다시보기로 정리해 주고, 막힌 순간을 감지해 곧바로 해결 방법을 안내해 따라 하기 좋은 흐름을 이어줍니다.</p></div>
<div class="pstage" data-slot="gha-s02"><div class="dev" style="--ar:691/803" data-src="https://embed.figma.com/proto/5e4pfCuh3LjDxSTj7JS5du/2.Split?node-id=2001-426&amp;starting-point-node-id=2001%3A426&amp;page-id=2001%3A414&amp;scaling=contain&amp;content-scaling=fixed&amp;hide-ui=1&amp;embed-host=share&amp;bg-color=eceef3" data-title="Scenario 02 가구 조립 따라하기 프로토타입"><img src="img/gha/s02p.webp" alt="Scenario 02 프로토타입 첫 화면"></div><a class="chip" href="https://www.figma.com/proto/5e4pfCuh3LjDxSTj7JS5du/2.Split-%EB%94%B0%EB%9D%BC%ED%95%98%EA%B8%B0?node-id=2001-426&amp;starting-point-node-id=2001%3A426&amp;page-id=2001%3A414&amp;scaling=min-zoom&amp;content-scaling=fixed" target="_blank" rel="noopener">새 창에서 체험 ↗</a></div>
<div class="pcap"><p class="pt"><span class="muted">Scenario 03. Ready-to-Pay at Starbucks</span><br>스타벅스 도착 시 준비되는 나를 위한 결제 혜택</p><p class="pb">더 이상 결제 직전, 어떤 카드를 꺼낼지 걱정하지 않아도 괜찮아요. 스타벅스 매장에 도착하면 AI가 위치 데이터를 기반으로 결제 상황을 감지해 하단의 빛으로 조용히 신호를 보냅니다. 그리고, 사용 가능한 기프트콘과 리워드 혜택을 자동으로 카드에 결합해, 사용자가 찾기 전에 이미 가장 유리한 결제가 자연스럽게 준비됩니다.</p></div>

<div class="pcap"><p class="pt"><span class="muted">Scenario 04. After the Concert, Your Album</span><br>케데헌 콘서트 다녀온 밤,<br>나만의 앨범 정리</p><p class="pb">콘서트를 다녀온 후 쌓이는 수백, 수천 장의 사진을 더 잘 정리할 수는 없을까? AI는 티켓 사진과 오늘 촬영한 284장의 공연 컷을 자동으로 식별해 하나의 콘서트 앨범으로 완성합니다. 흔들린 사진은 숨겨 정리를 돕고, 멤버별 하이라이트와 세트리스트별 묶어보기를 제공해 그날의 기억을 더욱 생생하게 돌아볼 수 있습니다.</p></div>
<div class="pstage" data-slot="gha-s04"><div class="dev" style="--ar:360/780" data-src="https://embed.figma.com/proto/UMDf5Syt0AGFlLe34pU3At/x?node-id=2001-1977&amp;starting-point-node-id=2001%3A1977&amp;page-id=2001%3A590&amp;scaling=contain&amp;content-scaling=fixed&amp;hide-ui=1&amp;embed-host=share&amp;bg-color=eceef3" data-title="Scenario 04 갤러리 정리 프로토타입"><img src="img/gha/s04p.webp" alt="Scenario 04 프로토타입 첫 화면"></div><a class="chip" href="https://www.figma.com/proto/UMDf5Syt0AGFlLe34pU3At/4.-Sync-%EA%B0%A4%EB%9F%AC%EB%A6%AC%EC%A0%95%EB%A6%AC?node-id=2001-1977&amp;starting-point-node-id=2001%3A1977&amp;page-id=2001%3A590&amp;scaling=min-zoom&amp;content-scaling=fixed" target="_blank" rel="noopener">새 창에서 체험 ↗</a></div>
<div class="pcap"><p class="pt"><span class="muted">Scenario 05. Capturing Slides and Audio in One Shot</span><br>사진 한 장에 담는 강연의 흐름</p><p class="pb">강연 내용을 모두 영상으로 기록하기 번거로울 때, 사진 한 장만으로도 그 순간의 음성을 함께 저장할 수 있다면 어떨까요? 슬라이드를 촬영하는 즉시 AI가 화면 속 슬라이드를 감지해, 그 장면의 음성을 자동으로 기록합니다. 촬영 후에는 강연자나 관객을 제외한 고화질 슬라이드와 음성·텍스트 노트가 하나의 자료로 정리되어, 발표 내용을 더 선명하고 온전히 되돌아볼 수 있습니다.</p></div>
<div class="pstage" data-slot="gha-s05"><div class="dev" style="--ar:360/780" data-src="https://embed.figma.com/proto/TxRB7rJV7v5ekMxXyEqmdD/x?node-id=2001-489&amp;starting-point-node-id=2001%3A489&amp;page-id=2001%3A447&amp;scaling=contain&amp;content-scaling=fixed&amp;hide-ui=1&amp;embed-host=share&amp;bg-color=eceef3" data-title="Scenario 05 강연 사진 정리 프로토타입"><img src="img/gha/s05p.webp" alt="Scenario 05 프로토타입 첫 화면"></div><a class="chip" href="https://www.figma.com/proto/TxRB7rJV7v5ekMxXyEqmdD/5.-Image-%EA%B0%95%EC%97%B0%EC%82%AC%EC%A7%84?node-id=2001-489&amp;starting-point-node-id=2001%3A489&amp;page-id=2001%3A447&amp;scaling=min-zoom&amp;content-scaling=fixed" target="_blank" rel="noopener">새 창에서 체험 ↗</a></div>
<div class="pcap"><p class="pt"><span class="muted">Scenario 06. Now You Can Paint with Light</span><br>어둠과 빛을 손끝으로 조율하는 라이트 브러시</p><p class="pb">이제는 빛을 그려낼 수 있습니다. 어두운 사진을 보정하려는 순간, AI가 라이트 브러시가 필요한 순간을 감지하면 다음 단계로 자연스럽게 이어집니다. 사용자는 빛을 더하거나 음영을 깊게 하듯 그리기만 하면 되고, 브러시는 손끝의 흐름과 농도를 읽어 연속적인 편집을 완성합니다.</p></div>
<div class="pstage" data-slot="gha-s06"><div class="dev" style="--ar:360/780" data-src="https://embed.figma.com/proto/8nzj1Igj9dCdJWn3pZFFYF/x?node-id=2001-2071&amp;starting-point-node-id=2001%3A2071&amp;page-id=2001%3A459&amp;scaling=contain&amp;content-scaling=fixed&amp;hide-ui=1&amp;embed-host=share&amp;bg-color=eceef3" data-title="Scenario 06 라이트 브러시 프로토타입"><img src="img/gha/s06p.webp" alt="Scenario 06 프로토타입 첫 화면"></div><a class="chip" href="https://www.figma.com/proto/8nzj1Igj9dCdJWn3pZFFYF/6.-Image-%EB%B9%9B%EA%B3%BC%EA%B7%B8%EB%A6%BC%EC%9E%90?node-id=2001-2071&amp;starting-point-node-id=2001%3A2071&amp;page-id=2001%3A459&amp;scaling=min-zoom&amp;content-scaling=fixed" target="_blank" rel="noopener">새 창에서 체험 ↗</a></div>
<div class="pcap"><p class="pt"><span class="muted">Scenario 07. Emails, Perfect on the Move</span><br>버스 위에서도 걱정 없는 수강정정 메일 작성</p><p class="pb">버스에서 급히 메일을 써도 괜찮아요. AI는 강연 정보부터 SNS 게시글, 그리고 당신이 남겨둔 노트까지 차분히 찾아 문장을 보완합니다. 어색한 표현은 자연스럽게 정제하고, 말투는 교수님께 맞게 부드럽게 조율해 줍니다.</p></div>
<div class="pstage" data-slot="gha-s07"><div class="dev" style="--ar:360/780" data-src="https://embed.figma.com/proto/H8ifRWnLp1yEh44ZMDsuJf/x?node-id=1-6743&amp;starting-point-node-id=1%3A6743&amp;page-id=0%3A1&amp;scaling=contain&amp;content-scaling=fixed&amp;hide-ui=1&amp;embed-host=share&amp;bg-color=eceef3" data-title="Scenario 07 수강정정 메일 프로토타입"><img src="img/gha/s07p.webp" alt="Scenario 07 프로토타입 첫 화면"></div><a class="chip" href="https://www.figma.com/proto/H8ifRWnLp1yEh44ZMDsuJf/7.-Text.%EC%88%98%EA%B0%95%EC%A0%95%EC%A0%95%EB%A9%94%EC%9D%BC?node-id=1-6743&amp;starting-point-node-id=1%3A6743&amp;page-id=0%3A1&amp;scaling=min-zoom&amp;content-scaling=fixed" target="_blank" rel="noopener">새 창에서 체험 ↗</a></div>
<div class="pcap"><p class="pt"><span class="muted">Scenario 08. Confident Ordering at Local French Spots</span><br>프랑스 현지 맛집에서도 망설임 없는 주문</p><p class="pb">프랑스 식당 앞에 도착한 순간, 잠금화면에서 AI가 인기 식당 정보를 먼저 알려주고 번역 카메라 실행을 제안합니다. 메뉴를 찍으면 가격·재료까지 맥락 있는 번역이 정리되어 쉽게 선택하고 주문할 수 있습니다.</p></div>
